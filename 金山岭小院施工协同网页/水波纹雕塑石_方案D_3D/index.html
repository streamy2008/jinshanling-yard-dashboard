<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>方案D · 雨落疏荷 — 3D 真实渲染</title>
<script type="module" src="https://unpkg.com/@google/model-viewer@3.5.0/dist/model-viewer.min.js"></script>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#0b0a09;
    font-family:'Songti SC','Noto Serif SC',serif}
  model-viewer{width:100%;height:100%;--poster-color:#0b0a09}
  .panel{position:absolute;top:14px;left:14px;background:rgba(16,14,12,.78);
    color:#e8dfca;padding:12px 16px;border-radius:12px;border:1px solid rgba(200,180,130,.3);
    max-width:260px;backdrop-filter:blur(5px);line-height:1.7;font-size:13px;z-index:5}
  .panel b{color:#d9c391;letter-spacing:2px}
  .panel small{color:#9a8d74}
  .btns{position:absolute;bottom:18px;left:50%;transform:translateX(-50%);display:flex;gap:10px;z-index:5}
  .btn{background:rgba(28,25,21,.85);color:#e8dfca;border:1px solid rgba(200,180,130,.35);
    padding:8px 15px;border-radius:999px;font-size:12px;letter-spacing:1px;cursor:pointer;font-family:inherit}
  .btn.on{background:#8a6f3a;color:#fff;border-color:#c9a95f}
  .hint{position:absolute;top:14px;right:14px;color:#a79a80;font-size:11px;text-align:right;line-height:1.7;z-index:5}
  .notice{position:absolute;bottom:66px;left:50%;transform:translateX(-50%);color:#8a7d64;font-size:11px;white-space:nowrap}
</style>
</head>
<body>
<model-viewer id="mv" src="方案D_雨落疏荷.glb" skybox-image="sky.jpg"
  alt="方案D 雨落疏荷 中国黑水波纹雕塑石"
  shadow-intensity="0.8" exposure="1.05" tone-mapping="aces"
  camera-controls auto-rotate rotation-per-second="12deg"
  camera-orbit="32deg 68deg 5.6m" min-camera-orbit="auto 20deg auto"
  field-of-view="38deg">
</model-viewer>

<div class="panel">
  <b>方案 D · 雨落疏荷</b><br>
  <small>中国黑水波纹雕塑石 2800×1500×400 · 顶部溢流镜面</small><br>
  <span>5 处出水点 · 涟漪环散落 · 静水镜面 ≥60%</span>
</div>
<div class="hint">拖拽旋转 · 滚轮缩放<br>双击复位 · 手机支持触控+AR</div>
<div class="notice">涟漪环 3~4 圈 · 环宽2~4mm · 浅刻2~3mm · 环顶抛光≥80°</div>
<div class="btns">
  <button class="btn on" id="btnRot">🔄 自动旋转</button>
  <button class="btn" id="btnTop">⬇ 俯视</button>
  <button class="btn" id="btnLevel">🌊 平视</button>
  <button class="btn" id="btn45">⛰ 45°</button>
</div>

<script>
const mv=document.getElementById('mv');
const btn=id=>document.getElementById(id);
btn('btnRot').onclick=e=>{mv.autoRotate=!mv.autoRotate;e.target.classList.toggle('on',mv.autoRotate)};
btn('btnTop').onclick=()=>{mv.cameraOrbit='0deg 88deg auto';mv.fieldOfView='38deg'};
btn('btnLevel').onclick=()=>{mv.cameraOrbit='0deg 18deg auto';mv.fieldOfView='42deg'};
btn('btn45').onclick=()=>{mv.cameraOrbit='35deg 55deg auto';mv.fieldOfView='38deg'};
</script>
</body>
</html>
