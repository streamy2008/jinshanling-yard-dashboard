<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>阿那亚庭院水景 — 逼真石材材质与空间 3D</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700;900&display=swap');
  body {
    margin: 0; background: #060504; color: #E8DFCA;
    font-family: 'Noto Serif SC', serif; overflow: hidden;
  }
  .ui-panel {
    background: rgba(14, 12, 10, 0.90);
    border: 1px solid rgba(160, 140, 110, 0.35);
    backdrop-filter: blur(16px);
    box-shadow: 0 12px 35px rgba(0,0,0,0.7);
  }
  .badge-tag {
    background: #3A3530; color: #E8DFCA; font-weight: 600; border: 1px solid #554D45;
  }
</style>
</head>
<body>

<div id="canvas-container" class="w-full h-screen"></div>

<!-- Top Control Header -->
<div class="absolute top-4 left-4 right-4 z-20 flex flex-col md:flex-row justify-between items-start md:items-center gap-3 pointer-events-none">
  <div class="ui-panel p-4 rounded-2xl max-w-md pointer-events-auto shadow-2xl">
    <div class="flex items-center gap-2 mb-1.5">
      <span class="badge-tag text-[10px] px-2.5 py-0.5 rounded-full">高保真 PBR 逼真材质</span>
      <span class="text-xs text-[#A39B90]">无植物空间重构</span>
    </div>
    <h1 class="text-base font-bold text-[#F4F1EA]">花格红砖墙 · 黑镜立柱 · 天然跌水石</h1>
    <p class="text-xs text-[#A39B90] mt-1 leading-relaxed">
      采用逼真天然花岗岩与红砖 PBR 程序化贴图。水从左侧高石顺势漫流跌落至下石，可调流速形成涟漪或平置静水黑镜。
    </p>
  </div>

  <div class="ui-panel p-3 rounded-2xl flex gap-2 pointer-events-auto">
    <button onclick="resetCam('photo')" class="px-3 py-1.5 rounded-xl text-xs font-semibold bg-[#C5A059] text-black">📷 实景视角</button>
    <button onclick="resetCam('top')" class="px-3 py-1.5 rounded-xl text-xs font-semibold bg-[#2A2725] text-[#E0DAD0] hover:bg-[#3A3530] transition">俯视视角</button>
    <button onclick="resetCam('iso')" class="px-3 py-1.5 rounded-xl text-xs font-semibold bg-[#2A2725] text-[#E0DAD0] hover:bg-[#3A3530] transition">透视视角</button>
  </div>
</div>

<!-- Bottom Floating Controls -->
<div class="absolute bottom-6 left-1/2 -translate-x-1/2 z-20 flex items-center gap-3 ui-panel px-4 py-2.5 rounded-full">
  <button onclick="toggleFlowSpeed()" id="btnSpeed" class="px-3.5 py-1.5 rounded-full text-xs font-bold bg-[#3A3530] text-[#E8DFCA] border border-[#554D45]">💧 水流状态: 跌水漫流</button>
  <button onclick="toggleDayNight()" id="btnLight" class="px-3.5 py-1.5 rounded-full text-xs font-bold bg-[#2A2725] text-[#E0DAD0]">🌙 月夜光影</button>
</div>

<script>
let scene, camera, renderer, controls;
let waterMesh, waterfallMesh, flowSpeed = 1.0, isNight = false;
let clock = new THREE.Clock();

function init() {
  const container = document.getElementById('canvas-container');
  
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x060504);
  scene.fog = new THREE.FogExp2(0x060504, 0.04);

  camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.1, 100);
  camera.position.set(-0.6, 1.5, 4.4);

  renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.35;
  container.appendChild(renderer.domElement);

  controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.dampingFactor = 0.05;
  controls.target.set(0.3, 0.85, 0);

  setupLighting();
  buildBrickWallPBR();       // 1. 红砖墙与花格
  buildPoolAndGravelPBR();   // 2. 碎石池底与自然池岸
  buildStonesAndWaterfallsPBR(); // 3. 逼真中国黑与花岗岩高矮双石

  window.addEventListener('resize', onWindowResize);
  animate();
}

function setupLighting() {
  const ambientLight = new THREE.AmbientLight(0xdbe4ff, 0.7);
  scene.add(ambientLight);

  const mainSun = new THREE.DirectionalLight(0xfff3e6, 2.8);
  mainSun.position.set(5, 9, 6);
  mainSun.castShadow = true;
  mainSun.shadow.mapSize.width = 2048;
  mainSun.shadow.mapSize.height = 2048;
  mainSun.shadow.bias = -0.0005;
  mainSun.name = "mainSun";
  scene.add(mainSun);

  const fillLight = new THREE.DirectionalLight(0x7892b5, 1.2);
  fillLight.position.set(-6, 5, -3);
  fillLight.name = "fillLight";
  scene.add(fillLight);

  // 侧面补光，凸显黑镜立柱与天然石头表面的高光缝隙
  const rimLight = new THREE.PointLight(0xc5a059, 1.2, 8);
  rimLight.position.set(0, 1.8, 1);
  scene.add(rimLight);
}

// 逼真程序化红砖凹凸法线贴图
function generateBrickNormalMap() {
  const canvas = document.createElement('canvas');
  canvas.width = 512; canvas.height = 512;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = 'rgb(128, 128, 255)'; ctx.fillRect(0,0,512,512);

  const imgData = ctx.getImageData(0, 0, 512, 512);
  const data = imgData.data;

  // 模拟烧结红砖的沙糙颗粒与砌缝
  for (let i = 0; i < data.length; i += 4) {
    let x = (i / 4) % 512;
    let y = Math.floor((i / 4) / 512);
    let nx = (Math.random() - 0.5) * 80;
    let ny = (Math.random() - 0.5) * 80;
    
    // 砖缝凹陷法线
    if (y % 32 < 4 || x % 64 < 4) {
      nx = -40; ny = -40;
    }
    data[i] = 128 + nx;
    data[i + 1] = 128 + ny;
    data[i + 2] = 255;
  }
  ctx.putImageData(imgData, 0, 0);

  const texture = new THREE.CanvasTexture(canvas);
  texture.wrapS = THREE.RepeatWrapping; texture.wrapT = THREE.RepeatWrapping;
  texture.repeat.set(4, 3);
  return texture;
}

// 逼真天然花岗岩深黑皮法线贴图
function generateGraniteNormalMap() {
  const canvas = document.createElement('canvas');
  canvas.width = 512; canvas.height = 512;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = 'rgb(128, 128, 255)'; ctx.fillRect(0,0,512,512);

  const imgData = ctx.getImageData(0, 0, 512, 512);
  const data = imgData.data;

  for (let i = 0; i < data.length; i += 4) {
    let nx = (Math.random() - 0.5) * 70;
    let ny = (Math.random() - 0.5) * 70;
    data[i] = 128 + nx;
    data[i + 1] = 128 + ny;
    data[i + 2] = 255;
  }
  ctx.putImageData(imgData, 0, 0);

  const texture = new THREE.CanvasTexture(canvas);
  texture.wrapS = THREE.RepeatWrapping; texture.wrapT = THREE.RepeatWrapping;
  texture.repeat.set(2, 2);
  return texture;
}

// 1. 红砖墙与花格砌筑
function buildBrickWallPBR() {
  const wallGroup = new THREE.Group();
  const brickNormal = generateBrickNormalMap();

  const brickMat = new THREE.MeshStandardMaterial({
    color: 0x9c3f2d,
    roughness: 0.75,
    metalness: 0.05,
    normalMap: brickNormal,
    normalScale: new THREE.Vector2(0.6, 0.6)
  });

  const wallW = 6.8, wallH = 2.4, brickW = 0.24, brickH = 0.10, brickD = 0.12;

  for (let y = 0; y < 21; y++) {
    for (let x = -14; x < 14; x++) {
      // 镂空方孔与花格放样
      if (y >= 6 && y <= 14 && (x + y) % 3 === 0 && x > -9 && x < 11) {
        continue;
      }
      const brickGeo = new THREE.BoxGeometry(brickW, brickH, brickD);
      const brick = new THREE.Mesh(brickGeo, brickMat);
      let offsetX = (y % 2 === 0) ? 0 : brickW / 2;
      brick.position.set(x * (brickW + 0.008) + offsetX, y * (brickH + 0.008), -1.1);
      brick.castShadow = true;
      brick.receiveShadow = true;
      wallGroup.add(brick);
    }
  }

  // 左侧棕红耐候钢墙
  const leftWallMat = new THREE.MeshStandardMaterial({ color: 0x54261c, roughness: 0.65, metalness: 0.3 });
  const leftWall = new THREE.Mesh(new THREE.BoxGeometry(0.2, 3.2, 3.2), leftWallMat);
  leftWall.position.set(-2.8, 1.5, 0.3);
  wallGroup.add(leftWall);

  scene.add(wallGroup);
}

// 2. 碎石池底与天然池岸
function buildPoolAndGravelPBR() {
  const poolGroup = new THREE.Group();
  const graniteNormal = generateGraniteNormalMap();

  // 池内深色镜面水体
  const poolWaterGeo = new THREE.CylinderGeometry(2.5, 2.5, 0.06, 64);
  const poolWaterMat = new THREE.MeshPhysicalMaterial({
    color: 0x07111a, roughness: 0.01, metalness: 0.95,
    transmission: 0.7, transparent: true, opacity: 0.88, clearcoat: 1.0
  });
  waterMesh = new THREE.Mesh(poolWaterGeo, poolWaterMat);
  waterMesh.position.set(0.2, 0.04, 0.2);
  poolGroup.add(waterMesh);

  // 3~5cm 碎石颗粒与散落石块
  const pebbleMat = new THREE.MeshStandardMaterial({ color: 0x2e2a26, roughness: 0.85 });
  for (let i = 0; i < 180; i++) {
    let angle = Math.random() * Math.PI * 2;
    let rad = 0.6 + Math.random() * 2.0;
    let size = 0.025 + Math.random() * 0.025; // 3~5cm
    const pebble = new THREE.Mesh(new THREE.DodecahedronGeometry(size, 1), pebbleMat);
    pebble.position.set(0.2 + Math.cos(angle) * rad, 0.01, 0.2 + Math.sin(angle) * rad);
    pebble.rotation.set(Math.random(), Math.random(), Math.random());
    poolGroup.add(pebble);
  }

  // 周边灰黑石打底地面
  const groundGeo = new THREE.PlaneGeometry(20, 20);
  const groundMat = new THREE.MeshStandardMaterial({
    color: 0x181614, roughness: 0.9, normalMap: graniteNormal, normalScale: new THREE.Vector2(0.4, 0.4)
  });
  const ground = new THREE.Mesh(groundGeo, groundMat);
  ground.rotation.x = -Math.PI / 2;
  ground.position.y = 0.0;
  ground.receiveShadow = true;
  poolGroup.add(ground);

  scene.add(poolGroup);
}

// 3. 逼真天然石头与黑镜柱
function buildStonesAndWaterfallsPBR() {
  const stoneGroup = new THREE.Group();
  const graniteNormal = generateGraniteNormalMap();

  // 逼真自然黑色花岗岩 PBR 材质
  const naturalStoneMat = new THREE.MeshPhysicalMaterial({
    color: 0x121212,
    roughness: 0.22,
    metalness: 0.15,
    clearcoat: 0.85,
    clearcoatRoughness: 0.08,
    reflectivity: 0.9,
    normalMap: graniteNormal,
    normalScale: new THREE.Vector2(0.35, 0.35)
  });

  // A. 左侧高石（出水源头）—— 非对称自然野趣山石网格
  const highStoneGeo = new THREE.DodecahedronGeometry(0.78, 3);
  const posA = highStoneGeo.attributes.position;
  for (let i = 0; i < posA.count; i++) {
    let x = posA.getX(i), y = posA.getY(i), z = posA.getZ(i);
    let noise = (Math.sin(x * 6.0) * Math.cos(z * 6.0)) * 0.04;
    posA.setX(i, x * 1.25 + noise);
    posA.setY(i, y * 1.45 + noise);
    posA.setZ(i, z * 0.9 + noise);
  }
  highStoneGeo.computeVertexNormals();

  const highStone = new THREE.Mesh(highStoneGeo, naturalStoneMat);
  highStone.position.set(-1.35, 0.72, 0.1);
  highStone.castShadow = true;
  stoneGroup.add(highStone);

  // B. 右侧下方卧式巨石（接收石）—— 凹凸圆润天然巨石
  const lowStoneGeo = new THREE.DodecahedronGeometry(0.92, 3);
  const posB = lowStoneGeo.attributes.position;
  for (let i = 0; i < posB.count; i++) {
    let x = posB.getX(i), y = posB.getY(i), z = posB.getZ(i);
    let noise = (Math.cos(x * 5.0) * Math.sin(z * 5.0)) * 0.05;
    posB.setX(i, x * 1.65 + noise);
    posB.setY(i, y * 0.72 + noise);
    posB.setZ(i, z * 1.1 + noise);
  }
  lowStoneGeo.computeVertexNormals();

  const lowStone = new THREE.Mesh(lowStoneGeo, naturalStoneMat);
  lowStone.position.set(0.82, 0.35, -0.2);
  lowStone.castShadow = true;
  lowStone.receiveShadow = true;
  stoneGroup.add(lowStone);

  // C. 照片同款黑镜长方柱 (极致抛光倒影)
  const pillarGeo = new THREE.BoxGeometry(0.18, 1.28, 0.18);
  const pillarMat = new THREE.MeshPhysicalMaterial({
    color: 0x040404, roughness: 0.01, metalness: 0.2,
    clearcoat: 1.0, clearcoatRoughness: 0.01, reflectivity: 1.0
  });
  const pillar = new THREE.Mesh(pillarGeo, pillarMat);
  pillar.position.set(0.06, 0.65, -0.28);
  pillar.castShadow = true;
  stoneGroup.add(pillar);

  // D. 从左高石顺势漫流下跌至水池的自然跌水瀑面
  const dropGeo = new THREE.CylinderGeometry(0.08, 0.14, 0.65, 32, 16, true);
  const dropMat = new THREE.MeshPhysicalMaterial({
    color: 0xbde6f8, roughness: 0.01, transmission: 0.9, transparent: true, opacity: 0.8, clearcoat: 1.0
  });
  waterfallMesh = new THREE.Mesh(dropGeo, dropMat);
  waterfallMesh.position.set(-0.72, 0.42, 0.05);
  waterfallMesh.rotation.z = -Math.PI / 5.5;
  stoneGroup.add(waterfallMesh);

  scene.add(stoneGroup);
}

function animate() {
  requestAnimationFrame(animate);
  const elapsed = clock.getElapsedTime() * flowSpeed;

  // 水池波纹与自然漫流
  if (waterMesh) {
    const pos = waterMesh.geometry.attributes.position;
    for (let i = 0; i < pos.count; i++) {
      let u = pos.getX(i);
      let v = pos.getY(i);
      let dx = u - (-0.45);
      let dy = v - 0.05;
      let dist = Math.sqrt(dx * dx + dy * dy);

      let waveZ = 0;
      if (dist < 2.0) {
        waveZ = Math.sin(dist * 16.0 - elapsed * 4.2) * Math.exp(-dist * 1.2) * 0.0038;
      }
      pos.setZ(i, waveZ);
    }
    waterMesh.geometry.computeVertexNormals();
    waterMesh.geometry.attributes.position.needsUpdate = true;
  }

  // 跌水水幕动态微幅流动
  if (waterfallMesh) {
    waterfallMesh.scale.x = 1.0 + Math.sin(elapsed * 3.0) * 0.03;
    waterfallMesh.scale.z = 1.0 + Math.cos(elapsed * 3.0) * 0.03;
  }

  controls.update();
  renderer.render(scene, camera);
}

function resetCam(type) {
  if (type === 'photo') {
    camera.position.set(-0.6, 1.5, 4.4);
    controls.target.set(0.3, 0.85, 0);
  } else if (type === 'top') {
    camera.position.set(0.3, 5.2, 0.01);
    controls.target.set(0.3, 0, 0);
  } else {
    camera.position.set(3.4, 3.0, 3.8);
    controls.target.set(0, 0.4, 0);
  }
}

function toggleFlowSpeed() {
  if (flowSpeed === 1.0) {
    flowSpeed = 0.3;
    document.getElementById('btnSpeed').innerText = "💧 水流状态: 静流微漫";
  } else if (flowSpeed === 0.3) {
    flowSpeed = 0.0;
    document.getElementById('btnSpeed').innerText = "🌊 水流状态: 关 (纯静止镜面)";
  } else {
    flowSpeed = 1.0;
    document.getElementById('btnSpeed').innerText = "💧 水流速度: 跌水漫流";
  }
}

function toggleDayNight() {
  isNight = !isNight;
  const btn = document.getElementById('btnLight');
  const mainSun = scene.getObjectByName('mainSun');
  const fillLight = scene.getObjectByName('fillLight');

  if (isNight) {
    scene.background.setHex(0x040404);
    mainSun.intensity = 0.3;
    fillLight.color.setHex(0x1a2b4c);
    btn.innerText = "🌙 月夜光影";
  } else {
    scene.background.setHex(0x060504);
    mainSun.intensity = 2.8;
    fillLight.color.setHex(0x7892b5);
    btn.innerText = "☀️ 晨曦阳光";
  }
}

function onWindowResize() {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
}

window.onload = init;
</script>
</body>
</html>
