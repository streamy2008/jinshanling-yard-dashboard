<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>方案 D · 雨落疏荷 — 自然随形独石 3D</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700;900&display=swap');
  
  body {
    margin: 0; background: #0A0908; color: #E8DFCA;
    font-family: 'Noto Serif SC', serif; overflow: hidden;
  }
  .ui-panel {
    background: rgba(18, 16, 14, 0.88);
    border: 1px solid rgba(120, 110, 95, 0.35);
    backdrop-filter: blur(14px);
    box-shadow: 0 10px 30px rgba(0,0,0,0.6);
  }
  .badge-tag {
    background: #3A3530; color: #E8DFCA; font-weight: 600; border: 1px solid #554D45;
  }
</style>
</head>
<body>

<div id="canvas-container" class="w-full h-screen"></div>

<!-- Top Control Header -->
<div class="absolute top-4 left-4 right-4 z-20 flex flex-col md:flex-row justify-between items-start md:items-center gap-3 pointer-events-none">
  <div class="ui-panel p-4 rounded-2xl max-w-md pointer-events-auto shadow-2xl">
    <div class="flex items-center gap-2 mb-1.5">
      <span class="badge-tag text-[10px] px-2.5 py-0.5 rounded-full">方案 D · 雨落疏荷</span>
      <span class="text-xs text-[#A39B90]">自然随形独石形态</span>
    </div>
    <h1 class="text-base font-bold text-[#F4F1EA]">天然随形野趣墨石 · 隐蔽单点涌泉</h1>
    <p class="text-xs text-[#A39B90] mt-1 leading-relaxed">
      摆脱死板直线框边界。石体为天然弧切野趣独石形态，仅在顶面天然隐蔽出水点缓缓涌水，水波向自然随形的石面边缘渐变扩散。
    </p>
  </div>

  <div class="ui-panel p-3 rounded-2xl flex gap-2 pointer-events-auto">
    <button onclick="resetCam('top')" class="px-3 py-1.5 rounded-xl text-xs font-semibold bg-[#2A2725] text-[#E0DAD0] hover:bg-[#3A3530] transition">俯视视角</button>
    <button onclick="resetCam('front')" class="px-3 py-1.5 rounded-xl text-xs font-semibold bg-[#2A2725] text-[#E0DAD0] hover:bg-[#3A3530] transition">正面视效</button>
    <button onclick="resetCam('iso')" class="px-3 py-1.5 rounded-xl text-xs font-semibold bg-[#2A2725] text-[#E0DAD0] hover:bg-[#3A3530] transition">透视全景</button>
  </div>
</div>

<!-- Bottom Floating Controls -->
<div class="absolute bottom-6 left-1/2 -translate-x-1/2 z-20 flex items-center gap-3 ui-panel px-4 py-2.5 rounded-full">
  <button onclick="toggleFlowSpeed()" id="btnFlowSpeed" class="px-3.5 py-1.5 rounded-full text-xs font-bold bg-[#3A3530] text-[#E8DFCA] border border-[#554D45]">💧 泉水状态: 自然微涌</button>
  <button onclick="toggleDayNight()" id="btnLight" class="px-3.5 py-1.5 rounded-full text-xs font-bold bg-[#2A2725] text-[#E0DAD0]">🌙 月夜光影</button>
</div>

<script>
let scene, camera, renderer, controls;
let waterMesh, flowSpeed = 1.0, isNight = false;
let clock = new THREE.Clock();

const singleSpring = { x: 0.1, z: 0.0 };

function init() {
  const container = document.getElementById('canvas-container');
  
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x0a0908);
  scene.fog = new THREE.FogExp2(0x0a0908, 0.06);

  camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.1, 100);
  camera.position.set(3.2, 2.8, 3.6);

  renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.2;
  container.appendChild(renderer.domElement);

  controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.dampingFactor = 0.05;
  controls.target.set(0, 0.2, 0);

  setupLighting();
  buildEnvironment();
  buildFreeformStoneD();

  window.addEventListener('resize', onWindowResize);
  animate();
}

function setupLighting() {
  const ambientLight = new THREE.AmbientLight(0xdbe4ff, 0.6);
  scene.add(ambientLight);

  const mainSun = new THREE.DirectionalLight(0xfff5ea, 2.4);
  mainSun.position.set(6, 9, 5);
  mainSun.castShadow = true;
  mainSun.name = "mainSun";
  scene.add(mainSun);

  const fillLight = new THREE.DirectionalLight(0x7892b5, 0.9);
  fillLight.position.set(-5, 4, -4);
  fillLight.name = "fillLight";
  scene.add(fillLight);
}

function generateStoneBumpMap() {
  const canvas = document.createElement('canvas');
  canvas.width = 512;
  canvas.height = 512;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = 'rgb(128, 128, 255)';
  ctx.fillRect(0, 0, 512, 512);

  const imgData = ctx.getImageData(0, 0, 512, 512);
  const data = imgData.data;
  for (let i = 0; i < data.length; i += 4) {
    const nx = (Math.random() - 0.5) * 50;
    const ny = (Math.random() - 0.5) * 50;
    data[i] = 128 + nx;
    data[i + 1] = 128 + ny;
    data[i + 2] = 255;
  }
  ctx.putImageData(imgData, 0, 0);

  const texture = new THREE.CanvasTexture(canvas);
  texture.wrapS = THREE.RepeatWrapping;
  texture.wrapT = THREE.RepeatWrapping;
  texture.repeat.set(3, 2);
  return texture;
}

function buildEnvironment() {
  const poolGeo = new THREE.CylinderGeometry(2.4, 2.5, 0.2, 64);
  const poolMat = new THREE.MeshStandardMaterial({ color: 0x121110, roughness: 0.4, metalness: 0.8 });
  const pool = new THREE.Mesh(poolGeo, poolMat);
  pool.position.y = -0.1;
  scene.add(pool);

  const poolWaterGeo = new THREE.CylinderGeometry(2.35, 2.35, 0.05, 64);
  const poolWaterMat = new THREE.MeshPhysicalMaterial({
    color: 0x080f14, roughness: 0.02, metalness: 0.9, transmission: 0.6, transparent: true, opacity: 0.85
  });
  const poolWater = new THREE.Mesh(poolWaterGeo, poolWaterMat);
  poolWater.position.y = 0.01;
  scene.add(poolWater);

  const groundGeo = new THREE.PlaneGeometry(20, 20);
  const groundMat = new THREE.MeshStandardMaterial({ color: 0x1a1816, roughness: 0.9 });
  const ground = new THREE.Mesh(groundGeo, groundMat);
  ground.rotation.x = -Math.PI / 2;
  ground.position.y = -0.2;
  ground.receiveShadow = true;
  scene.add(ground);
}

function buildFreeformStoneD() {
  const group = new THREE.Group();
  const bumpTexture = generateStoneBumpMap();

  // 天然平卧随形野趣原石 (彻底打破长方体，采用极坐标有机变形)
  const stoneGeo = new THREE.CylinderGeometry(1.35, 1.45, 0.38, 128, 32, false);
  const pos = stoneGeo.attributes.position;

  for (let i = 0; i < pos.count; i++) {
    let x = pos.getX(i);
    let y = pos.getY(i);
    let z = pos.getZ(i);

    let angle = Math.atan2(z, x);
    let radiusScale = 1.0 + Math.sin(angle * 3.0) * 0.18 + Math.cos(angle * 5.0) * 0.08;

    if (Math.abs(Math.cos(angle)) > 0.3) {
      x *= 1.8 * radiusScale;
    } else {
      z *= 0.95 * radiusScale;
    }

    if (y > 0.15) {
      let dx = x - singleSpring.x;
      let dz = z - singleSpring.z;
      let dist = Math.sqrt(dx * dx + dz * dz);
      let dip = 0;
      if (dist < 0.45) {
        dip = Math.cos(dist * Math.PI / 0.45) * 0.006;
      }
      let organicNoise = (Math.sin(x * 4.5) * Math.cos(z * 4.5)) * 0.004;
      y = 0.19 - dip + organicNoise;
    } else {
      let crag = (Math.sin(y * 22.0 + angle * 8.0) * 0.028) + (Math.random() - 0.5) * 0.018;
      x += Math.cos(angle) * crag;
      z += Math.sin(angle) * crag;
    }

    pos.setX(i, x);
    pos.setY(i, y);
    pos.setZ(i, z);
  }
  stoneGeo.computeVertexNormals();

  const stoneMat = new THREE.MeshPhysicalMaterial({
    color: 0x0c0c0c,
    roughness: 0.10,
    normalMap: bumpTexture,
    normalScale: new THREE.Vector2(0.3, 0.3),
    clearcoat: 0.9,
    clearcoatRoughness: 0.03,
    reflectivity: 0.9
  });
  const stone = new THREE.Mesh(stoneGeo, stoneMat);
  stone.position.y = 0.19;
  stone.castShadow = true;
  stone.receiveShadow = true;
  group.add(stone);

  // 顶面动态自然随形水膜
  const waterGeo = new THREE.CylinderGeometry(1.32, 1.32, 0.01, 128);
  const wPos = waterGeo.attributes.position;
  for (let i = 0; i < wPos.count; i++) {
    let x = wPos.getX(i);
    let y = wPos.getY(i);
    let z = wPos.getZ(i);
    let angle = Math.atan2(z, x);
    let radiusScale = 1.0 + Math.sin(angle * 3.0) * 0.18 + Math.cos(angle * 5.0) * 0.08;
    if (Math.abs(Math.cos(angle)) > 0.3) {
      x *= 1.78 * radiusScale;
    } else {
      z *= 0.93 * radiusScale;
    }
    wPos.setX(i, x);
    wPos.setZ(i, z);
  }
  waterGeo.computeVertexNormals();

  const waterMat = new THREE.MeshPhysicalMaterial({
    color: 0x0a1826,
    roughness: 0.01,
    transmission: 0.85,
    transparent: true,
    opacity: 0.72,
    clearcoat: 1.0,
    reflectivity: 1.0
  });
  waterMesh = new THREE.Mesh(waterGeo, waterMat);
  waterMesh.position.y = 0.385;
  group.add(waterMesh);

  scene.add(group);
}

function animate() {
  requestAnimationFrame(animate);
  const elapsed = clock.getElapsedTime() * flowSpeed;

  if (waterMesh) {
    const pos = waterMesh.geometry.attributes.position;
    for (let i = 0; i < pos.count; i++) {
      let u = pos.getX(i);
      let v = pos.getZ(i);

      if (pos.getY(i) > 0) {
        let dx = u - singleSpring.x;
        let dy = v - (-singleSpring.z);
        let dist = Math.sqrt(dx * dx + dy * dy);

        let waveZ = 0;
        if (dist < 1.4) {
          waveZ = Math.sin(dist * 14.0 - elapsed * 3.5) * Math.exp(-dist * 1.5) * 0.003;
        }
        pos.setY(i, 0.005 + waveZ);
      }
    }
    waterMesh.geometry.computeVertexNormals();
    waterMesh.geometry.attributes.position.needsUpdate = true;
  }

  controls.update();
  renderer.render(scene, camera);
}

function resetCam(type) {
  if (type === 'top') camera.position.set(0, 4.5, 0.01);
  else if (type === 'front') camera.position.set(0, 0.8, 3.8);
  else camera.position.set(3.2, 2.8, 3.6);
}

function toggleFlowSpeed() {
  if (flowSpeed === 1.0) {
    flowSpeed = 0.3;
    document.getElementById('btnFlowSpeed').innerText = "💧 泉水状态: 缓水微动";
  } else if (flowSpeed === 0.3) {
    flowSpeed = 0.0;
    document.getElementById('btnFlowSpeed').innerText = "🌊 泉水状态: 静止镜面";
  } else {
    flowSpeed = 1.0;
    document.getElementById('btnFlowSpeed').innerText = "💧 泉水状态: 自然微涌";
  }
}

function toggleDayNight() {
  isNight = !isNight;
  const btn = document.getElementById('btnLight');
  const mainSun = scene.getObjectByName('mainSun');
  const fillLight = scene.getObjectByName('fillLight');

  if (isNight) {
    scene.background.setHex(0x040404);
    mainSun.intensity = 0.3;
    fillLight.color.setHex(0x1a2b4c);
    btn.innerText = "🌙 月夜光影";
  } else {
    scene.background.setHex(0x0a0908);
    mainSun.intensity = 2.4;
    fillLight.color.setHex(0x7892b5);
    btn.innerText = "☀️ 晨曦阳光";
  }
}

function onWindowResize() {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
}

window.onload = init;
</script>
</body>
</html>
