<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>方案 D · 雨落疏荷 — Gemini 3D 艺术设计</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700;900&display=swap');
  
  body {
    margin: 0; background: #0A0908; color: #E8DFCA;
    font-family: 'Noto Serif SC', serif; overflow: hidden;
  }
  .ui-panel {
    background: rgba(18, 16, 14, 0.85);
    border: 1px solid rgba(197, 160, 89, 0.35);
    backdrop-filter: blur(12px);
  }
  .gold-tag {
    background: #C5A059; color: #1C1A19; font-weight: 700;
  }
</style>
</head>
<body>

<div id="canvas-container" class="w-full h-screen"></div>

<!-- Top Control Header -->
<div class="absolute top-4 left-4 right-4 z-20 flex flex-col md:flex-row justify-between items-start md:items-center gap-3 pointer-events-none">
  <div class="ui-panel p-4 rounded-2xl max-w-sm pointer-events-auto shadow-2xl">
    <div class="flex items-center gap-2 mb-1">
      <span class="gold-tag text-[10px] px-2 py-0.5 rounded-full">方案 D · 雨落疏荷</span>
      <span class="text-xs text-[#A39B90]">中国黑水波纹雕塑石</span>
    </div>
    <h1 class="text-base font-bold text-[#F4F1EA]">雨落疏荷 · 5点散落涟漪交错</h1>
    <p class="text-xs text-[#A39B90] mt-1 leading-relaxed">
      规格：2800×1500×400mm ｜ 理念：5 处出水点呈不等边三角分布，浅刻同心涟漪环并互相叠交，展现雨滴落入镜面水池的极简意境。
    </p>
  </div>

  <div class="ui-panel p-3 rounded-2xl flex gap-2 pointer-events-auto shadow-2xl">
    <button onclick="resetCam('top')" class="px-3 py-1.5 rounded-xl text-xs font-semibold bg-[#2A2725] text-[#E0DAD0] hover:bg-[#C5A059] hover:text-black transition">俯视视角</button>
    <button onclick="resetCam('front')" class="px-3 py-1.5 rounded-xl text-xs font-semibold bg-[#2A2725] text-[#E0DAD0] hover:bg-[#C5A059] hover:text-black transition">正面视效</button>
    <button onclick="resetCam('iso')" class="px-3 py-1.5 rounded-xl text-xs font-semibold bg-[#2A2725] text-[#E0DAD0] hover:bg-[#C5A059] hover:text-black transition">透视全景</button>
  </div>
</div>

<!-- Bottom Control & Lighting Toggles -->
<div class="absolute bottom-6 left-1/2 -translate-x-1/2 z-20 flex items-center gap-3 ui-panel px-4 py-2.5 rounded-full shadow-2xl">
  <button onclick="toggleAnimate()" id="btnAnim" class="px-3.5 py-1.5 rounded-full text-xs font-bold bg-[#C5A059] text-black">💧 涟漪波纹: 开</button>
  <button onclick="toggleDayNight()" id="btnLight" class="px-3.5 py-1.5 rounded-full text-xs font-bold bg-[#2A2725] text-[#E0DAD0]">🌙 夜景模式</button>
</div>

<script>
let scene, camera, renderer, controls;
let waterMesh, rippleGroups = [], isAnimate = true, isNight = false;
let clock = new THREE.Clock();

const springCenters = [
  { x: 0.0, z: 0.1, radius: 0.5 },
  { x: -0.9, z: -0.4, radius: 0.35 },
  { x: 0.8, z: -0.3, radius: 0.4 },
  { x: -0.6, z: 0.4, radius: 0.3 },
  { x: 0.7, z: 0.45, radius: 0.35 }
];

function init() {
  const container = document.getElementById('canvas-container');
  
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x0a0908);
  scene.fog = new THREE.FogExp2(0x0a0908, 0.08);

  camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.1, 100);
  camera.position.set(3.2, 2.8, 3.6);

  renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.1;
  container.appendChild(renderer.domElement);

  controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.dampingFactor = 0.05;
  controls.target.set(0, 0.2, 0);

  setupLighting();
  buildEnvironment();
  buildStoneD();

  window.addEventListener('resize', onWindowResize);
  animate();
}

function setupLighting() {
  const ambientLight = new THREE.AmbientLight(0xdbe4ff, 0.6);
  ambientLight.name = "ambient";
  scene.add(ambientLight);

  const mainSun = new THREE.DirectionalLight(0xfff5ea, 1.8);
  mainSun.position.set(5, 8, 4);
  mainSun.castShadow = true;
  mainSun.name = "mainSun";
  scene.add(mainSun);

  const fillLight = new THREE.DirectionalLight(0x7892b5, 0.8);
  fillLight.position.set(-5, 4, -4);
  fillLight.name = "fillLight";
  scene.add(fillLight);
}

function buildEnvironment() {
  const poolGeo = new THREE.CylinderGeometry(2.4, 2.5, 0.2, 64);
  const poolMat = new THREE.MeshStandardMaterial({ color: 0x121110, roughness: 0.3, metalness: 0.8 });
  const pool = new THREE.Mesh(poolGeo, poolMat);
  pool.position.y = -0.1;
  scene.add(pool);

  const poolWaterGeo = new THREE.CylinderGeometry(2.35, 2.35, 0.05, 64);
  const poolWaterMat = new THREE.MeshPhysicalMaterial({
    color: 0x080f14, roughness: 0.02, metalness: 0.9, transmission: 0.6, transparent: true, opacity: 0.85
  });
  const poolWater = new THREE.Mesh(poolWaterGeo, poolWaterMat);
  poolWater.position.y = 0.01;
  scene.add(poolWater);

  const groundGeo = new THREE.PlaneGeometry(20, 20);
  const groundMat = new THREE.MeshStandardMaterial({ color: 0x1a1816, roughness: 0.9 });
  const ground = new THREE.Mesh(groundGeo, groundMat);
  ground.rotation.x = -Math.PI / 2;
  ground.position.y = -0.2;
  scene.add(ground);
}

function buildStoneD() {
  const group = new THREE.Group();

  const stoneGeo = new THREE.BoxGeometry(2.8, 0.4, 1.5);
  const stoneMat = new THREE.MeshPhysicalMaterial({
    color: 0x111111, roughness: 0.06, metalness: 0.1, clearcoat: 1.0, clearcoatRoughness: 0.03
  });
  const stone = new THREE.Mesh(stoneGeo, stoneMat);
  stone.position.y = 0.2;
  stone.castShadow = true;
  group.add(stone);

  // 5 个出水点与多重同心涟漪
  springCenters.forEach((pt, sIdx) => {
    const springGroup = new THREE.Group();
    
    // 出水盖板
    const capGeo = new THREE.CylinderGeometry(0.04, 0.04, 0.01, 32);
    const capMat = new THREE.MeshStandardMaterial({ color: 0x3d352b, roughness: 0.4 });
    const cap = new THREE.Mesh(capGeo, capMat);
    cap.position.set(pt.x, 0.405, pt.z);
    springGroup.add(cap);

    // 涟漪多圈
    for (let r = 1; r <= 4; r++) {
      const ringGeo = new THREE.RingGeometry(r * (pt.radius / 4) - 0.01, r * (pt.radius / 4), 64);
      const ringMat = new THREE.MeshBasicMaterial({
        color: 0xc5a059, side: THREE.DoubleSide, transparent: true, opacity: 0.6 / r
      });
      const ring = new THREE.Mesh(ringGeo, ringMat);
      ring.rotation.x = -Math.PI / 2;
      ring.position.set(pt.x, 0.402, pt.z);
      springGroup.add(ring);
    }

    group.add(springGroup);
    rippleGroups.push(springGroup);
  });

  // 水面薄层
  const waterGeo = new THREE.PlaneGeometry(2.76, 1.46);
  const waterMat = new THREE.MeshPhysicalMaterial({
    color: 0x101a24, roughness: 0.01, transmission: 0.85, transparent: true, opacity: 0.65
  });
  waterMesh = new THREE.Mesh(waterGeo, waterMat);
  waterMesh.rotation.x = -Math.PI / 2;
  waterMesh.position.y = 0.401;
  group.add(waterMesh);

  scene.add(group);
}

function animate() {
  requestAnimationFrame(animate);
  const elapsed = clock.getElapsedTime();

  if (isAnimate) {
    rippleGroups.forEach((grp, sIdx) => {
      const rings = grp.children.slice(1);
      rings.forEach((ring, rIdx) => {
        const scaleProgress = ((elapsed * 0.8 + sIdx * 0.5 + rIdx * 0.2) % 1.5) + 0.5;
        ring.scale.set(scaleProgress, scaleProgress, 1);
      });
    });
  }

  controls.update();
  renderer.render(scene, camera);
}

function resetCam(type) {
  if (type === 'top') {
    camera.position.set(0, 4.5, 0.01);
  } else if (type === 'front') {
    camera.position.set(0, 0.8, 3.8);
  } else {
    camera.position.set(3.2, 2.8, 3.6);
  }
}

function toggleAnimate() {
  isAnimate = !isAnimate;
  const btn = document.getElementById('btnAnim');
  btn.innerText = `💧 涟漪波纹: ${isAnimate ? '开' : '关'}`;
  btn.className = `px-3.5 py-1.5 rounded-full text-xs font-bold ${isAnimate ? 'bg-[#C5A059] text-black' : 'bg-[#2A2725] text-[#E0DAD0]'}`;
}

function toggleDayNight() {
  isNight = !isNight;
  const btn = document.getElementById('btnLight');
  const mainSun = scene.getObjectByName('mainSun');
  const fillLight = scene.getObjectByName('fillLight');

  if (isNight) {
    scene.background.setHex(0x040404);
    mainSun.intensity = 0.2;
    fillLight.color.setHex(0x1a2b4c);
    btn.innerText = "☀️ 暖日模式";
  } else {
    scene.background.setHex(0x0a0908);
    mainSun.intensity = 1.8;
    fillLight.color.setHex(0x7892b5);
    btn.innerText = "🌙 夜景模式";
  }
}

function onWindowResize() {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
}

window.onload = init;
</script>
</body>
</html>
