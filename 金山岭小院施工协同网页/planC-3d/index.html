<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>方案 C · 远山入水 — 自然纹理石材 3D</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700;900&display=swap');
  
  body {
    margin: 0; background: #0A0908; color: #E8DFCA;
    font-family: 'Noto Serif SC', serif; overflow: hidden;
  }
  .ui-panel {
    background: rgba(18, 16, 14, 0.85);
    border: 1px solid rgba(197, 160, 89, 0.35);
    backdrop-filter: blur(12px);
  }
  .gold-tag {
    background: #C5A059; color: #1C1A19; font-weight: 700;
  }
</style>
</head>
<body>

<div id="canvas-container" class="w-full h-screen"></div>

<!-- Top Control Header -->
<div class="absolute top-4 left-4 right-4 z-20 flex flex-col md:flex-row justify-between items-start md:items-center gap-3 pointer-events-none">
  <div class="ui-panel p-4 rounded-2xl max-w-sm pointer-events-auto shadow-2xl">
    <div class="flex items-center gap-2 mb-1">
      <span class="gold-tag text-[10px] px-2 py-0.5 rounded-full">方案 C · 远山入水</span>
      <span class="text-xs text-[#A39B90]">自然花岗岩凹凸纹理</span>
    </div>
    <h1 class="text-base font-bold text-[#F4F1EA]">中国黑自然石体 · 薄膜水镜</h1>
    <p class="text-xs text-[#A39B90] mt-1 leading-relaxed">
      规格：2800×1500×400mm ｜ 特征：表面生成天然开裂肌理与有机凿纹，4道天然山脊折线层叠，水过石面呈现自然光影。
    </p>
  </div>

  <div class="ui-panel p-3 rounded-2xl flex gap-2 pointer-events-auto shadow-2xl">
    <button onclick="resetCam('top')" class="px-3 py-1.5 rounded-xl text-xs font-semibold bg-[#2A2725] text-[#E0DAD0] hover:bg-[#C5A059] hover:text-black transition">俯视视角</button>
    <button onclick="resetCam('front')" class="px-3 py-1.5 rounded-xl text-xs font-semibold bg-[#2A2725] text-[#E0DAD0] hover:bg-[#C5A059] hover:text-black transition">正面视效</button>
    <button onclick="resetCam('iso')" class="px-3 py-1.5 rounded-xl text-xs font-semibold bg-[#2A2725] text-[#E0DAD0] hover:bg-[#C5A059] hover:text-black transition">透视全景</button>
  </div>
</div>

<!-- Bottom Control -->
<div class="absolute bottom-6 left-1/2 -translate-x-1/2 z-20 flex items-center gap-3 ui-panel px-4 py-2.5 rounded-full shadow-2xl">
  <button onclick="toggleAnimate()" id="btnAnim" class="px-3.5 py-1.5 rounded-full text-xs font-bold bg-[#C5A059] text-black">💧 水体流动: 开</button>
  <button onclick="toggleDayNight()" id="btnLight" class="px-3.5 py-1.5 rounded-full text-xs font-bold bg-[#2A2725] text-[#E0DAD0]">🌙 夜景模式</button>
</div>

<script>
let scene, camera, renderer, controls;
let waterMesh, ridgeMeshes = [], isAnimate = true, isNight = false;
let clock = new THREE.Clock();

function init() {
  const container = document.getElementById('canvas-container');
  
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x0a0908);
  scene.fog = new THREE.FogExp2(0x0a0908, 0.08);

  camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.1, 100);
  camera.position.set(3.2, 2.8, 3.6);

  renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.15;
  container.appendChild(renderer.domElement);

  controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.dampingFactor = 0.05;
  controls.target.set(0, 0.2, 0);

  setupLighting();
  buildEnvironment();
  buildNaturalStoneC();

  window.addEventListener('resize', onWindowResize);
  animate();
}

function setupLighting() {
  const ambientLight = new THREE.AmbientLight(0xdbe4ff, 0.5);
  scene.add(ambientLight);

  const mainSun = new THREE.DirectionalLight(0xfff5ea, 2.2);
  mainSun.position.set(6, 9, 5);
  mainSun.castShadow = true;
  mainSun.name = "mainSun";
  scene.add(mainSun);

  const fillLight = new THREE.DirectionalLight(0x7892b5, 0.9);
  fillLight.position.set(-5, 4, -4);
  fillLight.name = "fillLight";
  scene.add(fillLight);
}

// 凹凸花岗岩法线与粗糙度程序纹理生成 (Procedural Granite Normal Map)
function generateGraniteNormalMap() {
  const canvas = document.createElement('canvas');
  canvas.width = 512;
  canvas.height = 512;
  const ctx = canvas.getContext('2d');

  ctx.fillStyle = 'rgb(128, 128, 255)';
  ctx.fillRect(0, 0, 512, 512);

  const imgData = ctx.getImageData(0, 0, 512, 512);
  const data = imgData.data;

  for (let i = 0; i < data.length; i += 4) {
    const nx = (Math.random() - 0.5) * 60;
    const ny = (Math.random() - 0.5) * 60;
    data[i] = 128 + nx;     // R -> Normal X
    data[i + 1] = 128 + ny; // G -> Normal Y
    data[i + 2] = 255;      // B -> Normal Z
  }
  ctx.putImageData(imgData, 0, 0);

  const texture = new THREE.CanvasTexture(canvas);
  texture.wrapS = THREE.RepeatWrapping;
  texture.wrapT = THREE.RepeatWrapping;
  texture.repeat.set(4, 2);
  return texture;
}

function buildEnvironment() {
  const poolGeo = new THREE.CylinderGeometry(2.4, 2.5, 0.2, 64);
  const poolMat = new THREE.MeshStandardMaterial({ color: 0x121110, roughness: 0.4, metalness: 0.8 });
  const pool = new THREE.Mesh(poolGeo, poolMat);
  pool.position.y = -0.1;
  scene.add(pool);

  const poolWaterGeo = new THREE.CylinderGeometry(2.35, 2.35, 0.05, 64);
  const poolWaterMat = new THREE.MeshPhysicalMaterial({
    color: 0x080f14, roughness: 0.02, metalness: 0.9, transmission: 0.6, transparent: true, opacity: 0.85
  });
  const poolWater = new THREE.Mesh(poolWaterGeo, poolWaterMat);
  poolWater.position.y = 0.01;
  scene.add(poolWater);

  const groundGeo = new THREE.PlaneGeometry(20, 20);
  const groundMat = new THREE.MeshStandardMaterial({ color: 0x1a1816, roughness: 0.9 });
  const ground = new THREE.Mesh(groundGeo, groundMat);
  ground.rotation.x = -Math.PI / 2;
  ground.position.y = -0.2;
  scene.add(ground);
}

function buildNaturalStoneC() {
  const group = new THREE.Group();
  const graniteTexture = generateGraniteNormalMap();

  // 高密度细分石体网格，形成天然凿纹与非对称有机边缘
  const stoneGeo = new THREE.BoxGeometry(2.8, 0.4, 1.5, 64, 16, 32);
  const pos = stoneGeo.attributes.position;

  // 扰动顶点，创造自然花岗岩凿面与微起伏
  for (let i = 0; i < pos.count; i++) {
    let x = pos.getX(i);
    let y = pos.getY(i);
    let z = pos.getZ(i);

    // 仅对顶部与侧面施加有机随机扰动，保持底面平整
    if (y > 0.1) {
      let noise1 = Math.sin(x * 3.5) * Math.cos(z * 4.0) * 0.035;
      let noise2 = Math.cos(x * 8.0 + z * 6.0) * 0.015;
      pos.setY(i, y + noise1 + noise2);
    }
    // 侧边自然凹凸开裂
    if (Math.abs(x) > 1.3) {
      pos.setX(i, x + (Math.random() - 0.5) * 0.02);
    }
    if (Math.abs(z) > 0.7) {
      pos.setZ(i, z + (Math.random() - 0.5) * 0.02);
    }
  }
  stoneGeo.computeVertexNormals();

  const stoneMat = new THREE.MeshPhysicalMaterial({
    color: 0x141414,
    roughness: 0.25,
    normalMap: graniteTexture,
    normalScale: new THREE.Vector2(0.4, 0.4),
    clearcoat: 0.8,
    clearcoatRoughness: 0.1,
    reflectivity: 0.8
  });
  const stone = new THREE.Mesh(stoneGeo, stoneMat);
  stone.position.y = 0.2;
  stone.castShadow = true;
  stone.receiveShadow = true;
  group.add(stone);

  // 顶面有机山脊 (自然顺滑的非规则多段线条)
  const ridgeXs = [-0.85, -0.25, 0.35, 0.95];
  ridgeXs.forEach((posX, idx) => {
    const curve = new THREE.CatmullRomCurve3([
      new THREE.Vector3(posX - 0.12, 0.41, -0.68),
      new THREE.Vector3(posX + 0.05, 0.418, -0.25),
      new THREE.Vector3(posX + 0.12, 0.42, 0.22),
      new THREE.Vector3(posX - 0.08, 0.41, 0.68)
    ]);

    const tubeGeo = new THREE.TubeGeometry(curve, 64, 0.018, 8, false);
    const tubeMat = new THREE.MeshStandardMaterial({
      color: 0xc5a059, roughness: 0.15, metalness: 0.8
    });
    const tube = new THREE.Mesh(tubeGeo, tubeMat);
    group.add(tube);
    ridgeMeshes.push(tube);
  });

  // 顶面层流薄水膜
  const waterGeo = new THREE.PlaneGeometry(2.74, 1.44, 32, 16);
  const waterMat = new THREE.MeshPhysicalMaterial({
    color: 0x162432, roughness: 0.01, transmission: 0.85, transparent: true, opacity: 0.75, clearcoat: 1.0
  });
  waterMesh = new THREE.Mesh(waterGeo, waterMat);
  waterMesh.rotation.x = -Math.PI / 2;
  waterMesh.position.y = 0.412;
  group.add(waterMesh);

  scene.add(group);
}

function animate() {
  requestAnimationFrame(animate);
  const elapsed = clock.getElapsedTime();

  if (isAnimate && waterMesh) {
    waterMesh.position.y = 0.412 + Math.sin(elapsed * 2.2) * 0.0012;
    ridgeMeshes.forEach((rg, i) => {
      rg.position.y = Math.sin(elapsed * 1.8 + i) * 0.0008;
    });
  }

  controls.update();
  renderer.render(scene, camera);
}

function resetCam(type) {
  if (type === 'top') camera.position.set(0, 4.5, 0.01);
  else if (type === 'front') camera.position.set(0, 0.8, 3.8);
  else camera.position.set(3.2, 2.8, 3.6);
}

function toggleAnimate() {
  isAnimate = !isAnimate;
  const btn = document.getElementById('btnAnim');
  btn.innerText = `💧 水体流动: ${isAnimate ? '开' : '关'}`;
  btn.className = `px-3.5 py-1.5 rounded-full text-xs font-bold ${isAnimate ? 'bg-[#C5A059] text-black' : 'bg-[#2A2725] text-[#E0DAD0]'}`;
}

function toggleDayNight() {
  isNight = !isNight;
  const btn = document.getElementById('btnLight');
  const mainSun = scene.getObjectByName('mainSun');
  const fillLight = scene.getObjectByName('fillLight');

  if (isNight) {
    scene.background.setHex(0x040404);
    mainSun.intensity = 0.3;
    fillLight.color.setHex(0x1a2b4c);
    btn.innerText = "☀️ 暖日模式";
  } else {
    scene.background.setHex(0x0a0908);
    mainSun.intensity = 2.2;
    fillLight.color.setHex(0x7892b5);
    btn.innerText = "🌙 夜景模式";
  }
}

function onWindowResize() {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
}

window.onload = init;
</script>
</body>
</html>
