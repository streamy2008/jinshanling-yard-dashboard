<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>方案 C · 远山入水 — 自然随形独石 3D</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700;900&display=swap');
  
  body {
    margin: 0; background: #0A0908; color: #E8DFCA;
    font-family: 'Noto Serif SC', serif; overflow: hidden;
  }
  .ui-panel {
    background: rgba(18, 16, 14, 0.88);
    border: 1px solid rgba(120, 110, 95, 0.35);
    backdrop-filter: blur(14px);
    box-shadow: 0 10px 30px rgba(0,0,0,0.6);
  }
  .badge-tag {
    background: #3A3530; color: #E8DFCA; font-weight: 600; border: 1px solid #554D45;
  }
</style>
</head>
<body>

<div id="canvas-container" class="w-full h-screen"></div>

<!-- Top Control Header -->
<div class="absolute top-4 left-4 right-4 z-20 flex flex-col md:flex-row justify-between items-start md:items-center gap-3 pointer-events-none">
  <div class="ui-panel p-4 rounded-2xl max-w-md pointer-events-auto shadow-2xl">
    <div class="flex items-center gap-2 mb-1.5">
      <span class="badge-tag text-[10px] px-2.5 py-0.5 rounded-full">方案 C · 远山入水</span>
      <span class="text-xs text-[#A39B90]">自然随形独石形态</span>
    </div>
    <h1 class="text-base font-bold text-[#F4F1EA]">天然随形野趣墨石 · 倒影静池</h1>
    <p class="text-xs text-[#A39B90] mt-1 leading-relaxed">
      打破规整方形限制，采用天然山石自然开剥的有机弧形边界。石体高低厚薄随形而就，顶面微倾斜做极致黑镜抛光，倒映上方松枝天光。
    </p>
  </div>

  <div class="ui-panel p-3 rounded-2xl flex gap-2 pointer-events-auto">
    <button onclick="resetCam('top')" class="px-3 py-1.5 rounded-xl text-xs font-semibold bg-[#2A2725] text-[#E0DAD0] hover:bg-[#3A3530] transition">俯视视角</button>
    <button onclick="resetCam('front')" class="px-3 py-1.5 rounded-xl text-xs font-semibold bg-[#2A2725] text-[#E0DAD0] hover:bg-[#3A3530] transition">正面视效</button>
    <button onclick="resetCam('iso')" class="px-3 py-1.5 rounded-xl text-xs font-semibold bg-[#2A2725] text-[#E0DAD0] hover:bg-[#3A3530] transition">透视全景</button>
  </div>
</div>

<!-- Bottom Floating Controls -->
<div class="absolute bottom-6 left-1/2 -translate-x-1/2 z-20 flex items-center gap-3 ui-panel px-4 py-2.5 rounded-full">
  <button onclick="toggleWaterFlow()" id="btnFlow" class="px-3.5 py-1.5 rounded-full text-xs font-bold bg-[#3A3530] text-[#E8DFCA] border border-[#554D45]">🌊 水状态: 自然微漫水膜</button>
  <button onclick="toggleDayNight()" id="btnLight" class="px-3.5 py-1.5 rounded-full text-xs font-bold bg-[#2A2725] text-[#E0DAD0]">🌙 月夜光影</button>
</div>

<script>
let scene, camera, renderer, controls;
let waterMesh, stoneMesh, treeGroup, isFlowing = true, isNight = false;
let clock = new THREE.Clock();

function init() {
  const container = document.getElementById('canvas-container');
  
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x0a0908);
  scene.fog = new THREE.FogExp2(0x0a0908, 0.06);

  camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.1, 100);
  camera.position.set(3.2, 2.8, 3.6);

  renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.2;
  container.appendChild(renderer.domElement);

  controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.dampingFactor = 0.05;
  controls.target.set(0, 0.2, 0);

  setupLighting();
  buildEnvironment();
  buildNaturalTreesAbove();
  buildFreeformStoneC();

  window.addEventListener('resize', onWindowResize);
  animate();
}

function setupLighting() {
  const ambientLight = new THREE.AmbientLight(0xdbe4ff, 0.6);
  scene.add(ambientLight);

  const mainSun = new THREE.DirectionalLight(0xfff5ea, 2.2);
  mainSun.position.set(6, 9, 5);
  mainSun.castShadow = true;
  mainSun.name = "mainSun";
  scene.add(mainSun);

  const fillLight = new THREE.DirectionalLight(0x7892b5, 0.9);
  fillLight.position.set(-5, 4, -4);
  fillLight.name = "fillLight";
  scene.add(fillLight);
}

function generateStoneBumpMap() {
  const canvas = document.createElement('canvas');
  canvas.width = 512;
  canvas.height = 512;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = 'rgb(128, 128, 255)';
  ctx.fillRect(0, 0, 512, 512);

  const imgData = ctx.getImageData(0, 0, 512, 512);
  const data = imgData.data;

  for (let i = 0; i < data.length; i += 4) {
    const nx = (Math.random() - 0.5) * 45;
    const ny = (Math.random() - 0.5) * 45;
    data[i] = 128 + nx;
    data[i + 1] = 128 + ny;
    data[i + 2] = 255;
  }
  ctx.putImageData(imgData, 0, 0);

  const texture = new THREE.CanvasTexture(canvas);
  texture.wrapS = THREE.RepeatWrapping;
  texture.wrapT = THREE.RepeatWrapping;
  texture.repeat.set(3, 2);
  return texture;
}

function buildEnvironment() {
  const poolGeo = new THREE.CylinderGeometry(2.4, 2.5, 0.2, 64);
  const poolMat = new THREE.MeshStandardMaterial({ color: 0x121110, roughness: 0.4, metalness: 0.8 });
  const pool = new THREE.Mesh(poolGeo, poolMat);
  pool.position.y = -0.1;
  scene.add(pool);

  const poolWaterGeo = new THREE.CylinderGeometry(2.35, 2.35, 0.05, 64);
  const poolWaterMat = new THREE.MeshPhysicalMaterial({
    color: 0x080f14, roughness: 0.02, metalness: 0.9, transmission: 0.6, transparent: true, opacity: 0.85
  });
  const poolWater = new THREE.Mesh(poolWaterGeo, poolWaterMat);
  poolWater.position.y = 0.01;
  scene.add(poolWater);

  const groundGeo = new THREE.PlaneGeometry(20, 20);
  const groundMat = new THREE.MeshStandardMaterial({ color: 0x1a1816, roughness: 0.9 });
  const ground = new THREE.Mesh(groundGeo, groundMat);
  ground.rotation.x = -Math.PI / 2;
  ground.position.y = -0.2;
  ground.receiveShadow = true;
  scene.add(ground);
}

function buildNaturalTreesAbove() {
  treeGroup = new THREE.Group();
  const branchMat = new THREE.MeshStandardMaterial({ color: 0x2b2219, roughness: 0.8 });
  const leafMat = new THREE.MeshStandardMaterial({ color: 0x3d4e34, roughness: 0.6 });

  const trunkGeo = new THREE.CylinderGeometry(0.06, 0.12, 3.5, 12);
  const trunk = new THREE.Mesh(trunkGeo, branchMat);
  trunk.position.set(-1.8, 1.8, -1.2);
  trunk.rotation.z = -Math.PI / 6;
  trunk.rotation.x = Math.PI / 8;
  trunk.castShadow = true;
  treeGroup.add(trunk);

  for (let i = 0; i < 7; i++) {
    const subBranch = new THREE.Mesh(new THREE.CylinderGeometry(0.02, 0.05, 1.2, 8), branchMat);
    subBranch.position.set(-1.2 + i * 0.25, 2.5 + Math.sin(i) * 0.2, -0.6 + (i % 2) * 0.4);
    subBranch.rotation.z = -Math.PI / 4 + (i % 3) * 0.1;
    subBranch.castShadow = true;
    treeGroup.add(subBranch);

    const leaves = new THREE.Mesh(new THREE.DodecahedronGeometry(0.35 + Math.random() * 0.2, 1), leafMat);
    leaves.position.set(-1.0 + i * 0.35, 2.7 + Math.sin(i) * 0.3, -0.5 + (i % 3) * 0.3);
    leaves.scale.set(1.2, 0.6, 1.0);
    leaves.castShadow = true;
    treeGroup.add(leaves);
  }
  scene.add(treeGroup);
}

// 构建彻底打破方形、自然随形的野趣原石 (Organic Cylinder/Extrude-based Freeform Stone)
function buildFreeformStoneC() {
  const group = new THREE.Group();
  const bumpTexture = generateStoneBumpMap();

  // 1. 使用极细分的圆柱网格作为基础，塑造成天然平卧的椭圆自然原石
  const stoneGeo = new THREE.CylinderGeometry(1.35, 1.45, 0.38, 128, 32, false);
  const pos = stoneGeo.attributes.position;

  // 2. 施加强烈的非对称极坐标拉伸与自然野趣凹凸变形
  for (let i = 0; i < pos.count; i++) {
    let x = pos.getX(i);
    let y = pos.getY(i);
    let z = pos.getZ(i);

    // 计算极坐标角度 theta 与半径 r
    let angle = Math.atan2(z, x);
    let radiusScale = 1.0 + Math.sin(angle * 3.0) * 0.18 + Math.cos(angle * 5.0) * 0.08;

    // 非对称拉伸：长向约 2.6m~2.9m，宽向约 1.3m~1.6m
    if (Math.abs(Math.cos(angle)) > 0.3) {
      x *= 1.8 * radiusScale;
    } else {
      z *= 0.95 * radiusScale;
    }

    // 顶面微倾斜与自然低洼：靠墙后沿略高，前沿微倾，方便水向池中自然滴落
    if (y > 0.15) {
      let slope = -z * 0.025; // 缓坡倾斜
      let organicDepression = Math.sin(x * 2.5) * Math.cos(z * 3.0) * 0.012;
      y = 0.19 + slope + organicDepression;
    } 
    // 侧边天然风化剥落与粗糙角质感
    else {
      let crag = (Math.sin(y * 25.0 + angle * 8.0) * 0.03) + (Math.random() - 0.5) * 0.02;
      x += Math.cos(angle) * crag;
      z += Math.sin(angle) * crag;
    }

    pos.setX(i, x);
    pos.setY(i, y);
    pos.setZ(i, z);
  }
  stoneGeo.computeVertexNormals();

  const stoneMat = new THREE.MeshPhysicalMaterial({
    color: 0x0a0a0a,
    roughness: 0.03,
    normalMap: bumpTexture,
    normalScale: new THREE.Vector2(0.25, 0.25),
    clearcoat: 0.95,
    clearcoatRoughness: 0.02,
    reflectivity: 0.95
  });
  stoneMesh = new THREE.Mesh(stoneGeo, stoneMat);
  stoneMesh.position.y = 0.19;
  stoneMesh.castShadow = true;
  stoneMesh.receiveShadow = true;
  group.add(stoneMesh);

  // 顶面自然平铺的水膜 (与随形原石轮廓贴合)
  const waterGeo = new THREE.CylinderGeometry(1.32, 1.32, 0.01, 128);
  const wPos = waterGeo.attributes.position;
  for (let i = 0; i < wPos.count; i++) {
    let x = wPos.getX(i);
    let y = wPos.getY(i);
    let z = wPos.getZ(i);
    let angle = Math.atan2(z, x);
    let radiusScale = 1.0 + Math.sin(angle * 3.0) * 0.18 + Math.cos(angle * 5.0) * 0.08;
    if (Math.abs(Math.cos(angle)) > 0.3) {
      x *= 1.78 * radiusScale;
    } else {
      z *= 0.93 * radiusScale;
    }
    wPos.setX(i, x);
    wPos.setZ(i, z);
  }
  waterGeo.computeVertexNormals();

  const waterMat = new THREE.MeshPhysicalMaterial({
    color: 0x0c1824,
    roughness: 0.01,
    transmission: 0.85,
    transparent: true,
    opacity: 0.65,
    clearcoat: 1.0,
    reflectivity: 0.95
  });
  waterMesh = new THREE.Mesh(waterGeo, waterMat);
  waterMesh.position.y = 0.385;
  group.add(waterMesh);

  scene.add(group);
}

function animate() {
  requestAnimationFrame(animate);
  const elapsed = clock.getElapsedTime();

  if (isFlowing && waterMesh) {
    waterMesh.material.opacity = 0.65;
    const pos = waterMesh.geometry.attributes.position;
    for (let i = 0; i < pos.count; i++) {
      let u = pos.getX(i);
      let v = pos.getZ(i);
      if (pos.getY(i) > 0) {
        let w1 = Math.sin(v * 5.0 - elapsed * 2.2) * 0.0015;
        let w2 = Math.cos((u + v) * 3.0 - elapsed * 1.5) * 0.001;
        pos.setY(i, 0.005 + w1 + w2);
      }
    }
    waterMesh.geometry.computeVertexNormals();
    waterMesh.geometry.attributes.position.needsUpdate = true;
  } else if (waterMesh) {
    waterMesh.material.opacity = 0.0;
  }

  if (treeGroup) {
    treeGroup.rotation.z = Math.sin(elapsed * 0.8) * 0.01;
  }

  controls.update();
  renderer.render(scene, camera);
}

function resetCam(type) {
  if (type === 'top') camera.position.set(0, 4.5, 0.01);
  else if (type === 'front') camera.position.set(0, 0.8, 3.8);
  else camera.position.set(3.2, 2.8, 3.6);
}

function toggleWaterFlow() {
  isFlowing = !isFlowing;
  const btn = document.getElementById('btnFlow');
  if (isFlowing) {
    btn.innerText = "🌊 水状态: 自然微漫水膜";
  } else {
    btn.innerText = "🌊 水状态: 关 (纯黑镜倒影)";
  }
}

function toggleDayNight() {
  isNight = !isNight;
  const btn = document.getElementById('btnLight');
  const mainSun = scene.getObjectByName('mainSun');
  const fillLight = scene.getObjectByName('fillLight');

  if (isNight) {
    scene.background.setHex(0x040404);
    mainSun.intensity = 0.3;
    fillLight.color.setHex(0x1a2b4c);
    btn.innerText = "🌙 月夜光影";
  } else {
    scene.background.setHex(0x0a0908);
    mainSun.intensity = 2.2;
    fillLight.color.setHex(0x7892b5);
    btn.innerText = "☀️ 晨曦阳光";
  }
}

function onWindowResize() {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
}

window.onload = init;
</script>
</body>
</html>
