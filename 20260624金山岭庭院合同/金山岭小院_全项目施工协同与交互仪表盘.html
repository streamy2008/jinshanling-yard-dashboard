<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>金山岭小院 · 施工协同</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  :root {
    --brand: #2563eb;
    --bg: #f1f5f9;
  }
  * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
  body {
    background: var(--bg);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    padding-bottom: 76px;
    color: #1e293b;
  }
  .card {
    background: #fff;
    border-radius: 14px;
    border: 1px solid #e2e8f0;
    box-shadow: 0 1px 2px rgba(15,23,42,.04);
  }
  .tap {
    min-height: 44px;
    touch-action: manipulation;
    -webkit-user-select: none;
    user-select: none;
  }
  .input {
    width: 100%;
    border: 1px solid #e2e8f0;
    border-radius: 10px;
    padding: 10px 12px;
    font-size: 14px;
    background: #f8fafc;
    transition: border-color .15s, background .15s;
  }
  .input:focus {
    border-color: var(--brand);
    background: #fff;
    outline: none;
    box-shadow: 0 0 0 3px rgba(37,99,235,.12);
  }
  .chip {
    display: inline-flex; align-items: center; gap: 4px;
    padding: 7px 13px; border-radius: 999px;
    font-size: 13px; font-weight: 600;
    border: 1px solid #e2e8f0; background: #fff; color: #475569;
    touch-action: manipulation;
  }
  .chip.active { background: var(--brand); border-color: var(--brand); color: #fff; }
  .badge {
    display: inline-flex; align-items: center; gap: 3px;
    padding: 3px 9px; border-radius: 999px;
    font-size: 11px; font-weight: 700;
  }
  .st-pending { background:#f1f5f9; color:#475569; }
  .st-pass { background:#dcfce7; color:#166534; }
  .st-progress { background:#fef9c3; color:#854d0e; }
  .st-risk { background:#fee2e2; color:#991b1b; }
  .seg {
    display:flex; overflow-x:auto; gap:6px; padding:8px 12px;
    -webkit-overflow-scrolling:touch; scrollbar-width:none;
  }
  .seg::-webkit-scrollbar{display:none;}
  .seg-item {
    flex:0 0 auto; padding:8px 14px; border-radius:10px;
    font-size:13px; font-weight:600; color:#64748b; background:#fff;
    border:1px solid #e2e8f0; white-space:nowrap; touch-action:manipulation;
  }
  .seg-item.active { background:#1e293b; color:#fff; border-color:#1e293b; }
  .dot { width:8px; height:8px; border-radius:999px; display:inline-block; }
  .acc-body { overflow:hidden; transition: max-height .25s ease; }
  .field-label { font-size:11px; color:#94a3b8; font-weight:600; margin-bottom:4px; letter-spacing:.02em; }
</style>
</head>
<body>

<!-- ===== Top Bar ===== -->
<header class="sticky top-0 z-40 bg-slate-900 text-white shadow-lg">
  <div class="px-4 pt-3 pb-2">
    <div class="flex items-center justify-between">
      <div class="flex items-center gap-2">
        <span class="text-lg">🏛️</span>
        <div>
          <div class="text-[15px] font-bold leading-tight">金山岭小院 · 施工协同</div>
          <div class="text-[10px] text-slate-400 mt-0.5">9月3日 11:00 现场交底 · 四方协同</div>
        </div>
      </div>
      <select id="userRole" class="bg-slate-800 text-white text-xs font-semibold rounded-lg px-2 py-2 border border-slate-700 focus:outline-none max-w-[130px]">
        <option value="业主代表">业主代表</option>
        <option value="建筑设计(MINOR lab)">建筑设计</option>
        <option value="石材厂(里山墨石)">石材厂·汤</option>
        <option value="施工方(总包/钢构)">施工方</option>
        <option value="园林设计">园林设计</option>
      </select>
    </div>
  </div>

  <!-- Segmented Tab Bar -->
  <div class="seg">
    <button onclick="switchTab('tab1')" id="t1" class="seg-item active">📋 交底清单</button>
    <button onclick="switchTab('tab2')" id="t2" class="seg-item">📜 修改日志 <span id="logCnt" class="ml-1 text-blue-300 font-bold">0</span></button>
    <button onclick="switchTab('tab3')" id="t3" class="seg-item">🧱 工程量清单</button>
    <button onclick="switchTab('tab4')" id="t4" class="seg-item">🔀 交叉碰撞</button>
    <button onclick="switchTab('tab5')" id="t5" class="seg-item">🏗️ 吊车计算</button>
    <button onclick="switchTab('tab6')" id="t6" class="seg-item">⏳ 里程碑</button>
  </div>
</header>

<main class="px-3 pt-3 space-y-3">

  <!-- ============ TAB 1 : CHECKLIST ============ -->
  <section id="tab1" class="space-y-3">
    <!-- Progress Overview -->
    <div class="card p-4">
      <div class="flex items-center justify-between mb-2">
        <div class="text-sm font-bold">交底完成进度</div>
        <div class="text-sm font-bold text-blue-600" id="overallPct">0%</div>
      </div>
      <div class="h-2 bg-slate-100 rounded-full overflow-hidden">
        <div id="overallBar" class="h-full bg-blue-600 rounded-full transition-all" style="width:0%"></div>
      </div>
      <div class="grid grid-cols-4 gap-2 mt-3 text-center">
        <div><div class="text-lg font-bold text-slate-800" id="kpiTotal">17</div><div class="text-[10px] text-slate-400">总项</div></div>
        <div><div class="text-lg font-bold text-emerald-600" id="kpiPass">0</div><div class="text-[10px] text-slate-400">已通过</div></div>
        <div><div class="text-lg font-bold text-amber-600" id="kpiProgress">0</div><div class="text-[10px] text-slate-400">处理中</div></div>
        <div><div class="text-lg font-bold text-slate-400" id="kpiPending">17</div><div class="text-[10px] text-slate-400">未复核</div></div>
      </div>
    </div>

    <!-- Filter Chips -->
    <div class="flex gap-2 overflow-x-auto no-scrollbar" id="filterChips">
      <button class="chip active" data-f="all" onclick="setFilter('all', this)">全部</button>
      <button class="chip" data-f="pass" onclick="setFilter('pass', this)">🟢 已通过</button>
      <button class="chip" data-f="progress" onclick="setFilter('progress', this)">🟡 处理中</button>
      <button class="chip" data-f="risk" onclick="setFilter('risk', this)">🔴 存疑整改</button>
      <button class="chip" data-f="pending" onclick="setFilter('pending', this)">⚪ 未复核</button>
    </div>

    <!-- Checklist Cards Container -->
    <div id="checklistContainer" class="space-y-3"></div>
  </section>

  <!-- ============ TAB 2 : AUDIT LOG ============ -->
  <section id="tab2" class="hidden space-y-3">
    <div class="card p-3 flex items-center justify-between">
      <div class="text-sm font-bold">📜 修改痕迹审计日志</div>
      <button onclick="clearAuditLogs()" class="text-xs bg-red-50 text-red-600 font-semibold px-3 py-1.5 rounded-lg">清空日志</button>
    </div>
    <div id="auditContainer" class="space-y-2"></div>
  </section>

  <!-- ============ TAB 3 : MANIFEST ============ -->
  <section id="tab3" class="hidden space-y-3">
    <div class="card p-4">
      <div class="text-sm font-bold">构件预估总重量</div>
      <div class="text-2xl font-black text-blue-700 mt-1">34.38 吨</div>
      <div class="grid grid-cols-3 gap-2 mt-2 text-center">
        <div class="bg-blue-50 rounded-lg p-2"><div class="text-sm font-bold text-blue-700">24.34t</div><div class="text-[10px] text-blue-600">石材</div></div>
        <div class="bg-indigo-50 rounded-lg p-2"><div class="text-sm font-bold text-indigo-700">1.70t</div><div class="text-[10px] text-indigo-600">钢构</div></div>
        <div class="bg-emerald-50 rounded-lg p-2"><div class="text-sm font-bold text-emerald-700">8.50t</div><div class="text-[10px] text-emerald-600">混凝土</div></div>
      </div>
    </div>
    <div id="manifestContainer" class="space-y-3"></div>
  </section>

  <!-- ============ TAB 4 : CROSS POINTS ============ -->
  <section id="tab4" class="hidden space-y-3">
    <div class="card p-4">
      <div class="text-sm font-bold">6 大主工序 · 5 处关键交叉碰撞</div>
      <div class="text-xs text-slate-500 mt-1">防止基础被压坏、石材螺栓眼错位、电焊火花烧伤石材等风险</div>
    </div>
    <div id="crossContainer" class="space-y-3"></div>
  </section>

  <!-- ============ TAB 5 : CRANE ============ -->
  <section id="tab5" class="hidden space-y-3">
    <div id="craneContainer" class="space-y-3"></div>
  </section>

  <!-- ============ TAB 6 : WBS ============ -->
  <section id="tab6" class="hidden space-y-3">
    <div class="card p-4">
      <div class="text-sm font-bold">施工进度排期与关键里程碑</div>
      <div class="text-xs text-slate-500 mt-1">10 大 WBS 节点 · 现场验收卡口</div>
    </div>
    <div id="wbsContainer" class="space-y-3"></div>
  </section>

</main>

<!-- ===== Sticky Bottom Action Bar ===== -->
<footer class="fixed bottom-0 left-0 right-0 z-40 bg-white border-t border-slate-200 px-3 py-2">
  <div class="flex gap-2 max-w-md mx-auto">
    <button onclick="saveData()" class="flex-1 tap bg-blue-600 active:bg-blue-700 text-white rounded-xl py-3 text-sm font-bold shadow">💾 保存改动</button>
    <button onclick="exportJSON()" class="flex-1 tap bg-slate-100 active:bg-slate-200 text-slate-700 rounded-xl py-3 text-sm font-bold">📤 导出</button>
    <button onclick="document.getElementById('importFile').click()" class="flex-1 tap bg-slate-100 active:bg-slate-200 text-slate-700 rounded-xl py-3 text-sm font-bold">📥 导入</button>
    <input type="file" id="importFile" onchange="importJSON(event)" class="hidden">
  </div>
</footer>

function loadSavedData() {
  try {
    const c = localStorage.getItem('jl_checklist_v3');

    if (c) checklistData = JSON.parse(c);
    if (l) auditLogs = JSON.parse(l);

function escapeHtml(s){ if(!s) return ''; return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function stClass(st){
  if(st==='已通过(无误差)') return 'st-pass';
  if(st==='存疑/需整改') return 'st-risk';
  if(st==='处理中') return 'st-progress';
  return 'st-pending';
}
function stLabel(st){
  if(st==='已通过(无误差)') return '🟢 已通过';
  if(st==='存疑/需整改') return '🔴 存疑整改';
  if(st==='处理中') return '🟡 处理中';
  return '⚪ 未复核';
}

function matchesFilter(st){
  if(currentFilter==='all') return true;
  if(currentFilter==='pass') return st==='已通过(无误差)';
  if(currentFilter==='risk') return st==='存疑/需整改';
  if(currentFilter==='progress') return st==='处理中';
  if(currentFilter==='pending') return st==='未复核';
  return true;
}

function renderChecklist(){
  const cont = document.getElementById('checklistContainer');
  cont.innerHTML = '';
  let total=0, pass=0, progress=0, pending=0;

  checklistData.forEach((sec, si) => {
    // count section stats
    let sTotal = sec.items.length, sPass = sec.items.filter(i=>i.status==='已通过(无误差)').length;

    const visibleItems = sec.items.filter(i => matchesFilter(i.status));
    if (visibleItems.length === 0) return;

    // Section header card
    const secCard = document.createElement('div');
    secCard.className = 'card p-3';
    secCard.innerHTML = `
      <div class="flex items-center justify-between">
        <div class="text-[13px] font-bold text-slate-700">${sec.section}</div>
        <div class="text-[11px] font-semibold ${sPass===sTotal ? 'text-emerald-600' : 'text-slate-400'}">${sPass}/${sTotal}</div>
      </div>
      <div class="h-1 bg-slate-100 rounded-full mt-2 overflow-hidden">
        <div class="h-full bg-emerald-500 rounded-full" style="width:${sPass/sTotal*100}%"></div>
      </div>`;
    cont.appendChild(secCard);

    // Item cards
    visibleItems.forEach((item, ii) => {
      total++; 
      if(item.status==='已通过(无误差)') pass++;
      else if(item.status==='存疑/需整改'||item.status==='处理中') progress++;
      else pending++;

      // find global index in original data
      const gi = sec.items.indexOf(item);
      const key = si+'-'+gi;
      const isOpen = expandedSet.has(key);

      const card = document.createElement('div');
      card.className = 'card overflow-hidden';
      card.innerHTML = `
        <div class="tap p-3 flex items-start gap-3" onclick="toggleCard('${key}')">
          <div class="flex-shrink-0 w-9 h-9 rounded-lg bg-slate-100 text-slate-500 flex items-center justify-center text-xs font-bold">${item.id}</div>
          <div class="flex-1 min-w-0">
            <div class="flex items-center justify-between gap-2">
              <div class="text-[13px] font-semibold text-slate-800 leading-tight">${escapeHtml(item.name)}</div>
              <span class="badge ${stClass(item.status)} flex-shrink-0">${stLabel(item.status)}</span>
            </div>
            <div class="text-[11px] text-slate-400 mt-1 line-clamp-2">${escapeHtml(item.desc)}</div>
          </div>
          <svg class="flex-shrink-0 w-4 h-4 text-slate-300 transition-transform ${isOpen?'rotate-180':''}" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/></svg>
        </div>
        <div class="acc-body" style="max-height:${isOpen?'1000px':'0px'}">
          <div class="px-3 pb-3 space-y-3 border-t border-slate-100 pt-3">
            <div class="flex items-center justify-between text-[11px] text-slate-400">
              <span class="font-mono">📐 ${escapeHtml(item.ref)}</span>
              <span>👥 ${escapeHtml(item.owner)}</span>
            </div>

            <div>
              <div class="field-label">状态评估</div>
              <div class="grid grid-cols-4 gap-1">
                ${['未复核','已通过(无误差)','处理中','存疑/需整改'].map(st=>`
                  <button onclick="setStatus(${si},${gi},'${st}')" class="tap py-2 rounded-lg text-[11px] font-bold border ${item.status===st?stClass(st)+' border-current':'bg-slate-50 text-slate-400 border-slate-200'}">${stLabel(st).replace('⚪ ','').replace('🟢 ','').replace('🟡 ','').replace('🔴 ','')}</button>
                `).join('')}
              </div>
            </div>

            <div>
              <div class="field-label">现场实测数据 / 决定记录</div>
              <textarea class="input" rows="2" onchange="onField(${si},${gi},'measure','实测决定',this.value,'${escapeHtml(item.measure)}')">${escapeHtml(item.measure)}</textarea>
            </div>

            <div>
              <div class="field-label">整改 / 落实行动计划</div>
              <textarea class="input" rows="2" onchange="onField(${si},${gi},'action','行动计划',this.value,'${escapeHtml(item.action)}')">${escapeHtml(item.action)}</textarea>
            </div>

            <div class="grid grid-cols-2 gap-2">
              <div>
                <div class="field-label">完成日期</div>
                <input type="date" class="input" value="${item.date}" onchange="onField(${si},${gi},'date','完成日期',this.value,'${item.date}')">
              </div>
              <div>
                <div class="field-label">复核签字</div>
                <input type="text" class="input" placeholder="签字" value="${escapeHtml(item.reviewer||'')}" onchange="onField(${si},${gi},'reviewer','复核签字',this.value,'${escapeHtml(item.reviewer||'')}')">
              </div>
            </div>
          </div>
        </div>`;
      cont.appendChild(card);
    });
  });

  // Update KPI
  document.getElementById('kpiTotal').innerText = total;
  document.getElementById('kpiPass').innerText = pass;
  document.getElementById('kpiProgress').innerText = progress;
  document.getElementById('kpiPending').innerText = pending;
  const pct = total ? Math.round(pass/total*100) : 0;
  document.getElementById('overallPct').innerText = pct + '%';
  document.getElementById('overallBar').style.width = pct + '%';
}

function toggleCard(key){
  if(expandedSet.has(key)) expandedSet.delete(key); else expandedSet.add(key);
  renderChecklist();
}

function setFilter(f, el){
  currentFilter = f;
  document.querySelectorAll('#filterChips .chip').forEach(c=>c.classList.remove('active'));
  el.classList.add('active');
  renderChecklist();
}

function setStatus(si, gi, st){
  onField(si, gi, 'status', '评估状态', st, checklistData[si].items[gi].status);
}

function onField(si, gi, key, fieldName, newVal, oldVal){
  if(newVal === oldVal) return;
  const item = checklistData[si].items[gi];
  const operator = document.getElementById('userRole').value || '未知操作人';
  const ts = new Date().toLocaleString('zh-CN',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'});
  auditLogs.unshift({ time: ts, user: operator, id: item.id, field: fieldName, oldVal: oldVal||'(空)', newVal: newVal||'(空)' });
  item[key] = newVal;
  saveLocal();
  renderChecklist();
  renderAudit();
}

          <span class="text-[10px] bg-slate-100 text-slate-500 px-2 py-0.5 rounded font-semibold">${w.days}天</span>
        </div>
        <div class="text-[13px] font-semibold text-slate-800 mt-0.5">${w.name}</div>
        <div class="text-[11px] text-slate-400 mt-0.5">${w.owner} · ${w.start} → ${w.end}</div>
        <div class="text-[10px] mt-1 inline-flex bg-blue-50 text-blue-600 px-2 py-0.5 rounded">📍 ${w.ms}</div>
      </div>`;
    cont.appendChild(div);
  });
}

function saveLocal(){
  localStorage.setItem('jl_checklist_v3', JSON.stringify(checklistData));
  localStorage.setItem('jl_logs_v3', JSON.stringify(auditLogs));
}
function saveData(){
  saveLocal();
  alert('💾 包含完整修改痕迹的数据已成功保存！');
}
function exportJSON(){
  const obj = { checklistData, auditLogs };
  const s = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(obj,null,2));
  const a = document.createElement('a');
  a.href = s; a.download = `金山岭小院交底数据_${new Date().toISOString().slice(0,10)}.json`;
  document.body.appendChild(a); a.click(); a.remove();
}
function importJSON(e){
  const f = e.target.files[0]; if(!f) return;
  const r = new FileReader();
  r.onload = function(ev){
    try{
      const d = JSON.parse(ev.target.result);
      if(d.checklistData && Array.isArray(d.checklistData)){ checklistData = d.checklistData; auditLogs = d.auditLogs||[]; }
      else if(Array.isArray(d)){ checklistData = d; }
      saveLocal(); renderChecklist(); renderAudit();
      alert('📥 成功导入数据及修改痕迹！');
    }catch(err){ alert('⚠️ 导入文件格式错误！'); }
  };
  r.readAsText(f);
}

function switchTab(tab){
  for(let i=1;i<=6;i++){
    document.getElementById('tab'+i).classList.add('hidden');
    document.getElementById('t'+i).classList.remove('active');
  }
  document.getElementById(tab).classList.remove('hidden');
  document.getElementById(tab.replace('tab','t')).classList.add('active');
  window.scrollTo({top:0, behavior:'smooth'});
}

// Init
loadSavedData();
renderChecklist();
renderAudit();
renderManifest();
renderCross();
renderCrane();
renderWbs();
</script>
