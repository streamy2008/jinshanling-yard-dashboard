<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>金山岭小院 · 施工协同</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@600;700&display=swap');
  
  :root {
    --bg-main: #FAF8F5;          /* 暖米白/宣纸色 */
    --card-bg: #FFFFFF;
    --text-primary: #1C1917;     /* 石墨灰/黑 */
    --text-muted: #78716C;       /* 苔灰 */
    --gold-accent: #C5A059;     /* 墨金/古铜 */
    --gold-bg: #FAF6F0;
    --border-color: #E7E5E4;
  }

  * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
  body {
    background: var(--bg-main);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Heiti SC", sans-serif;
    padding-bottom: 84px;
    color: var(--text-primary);
  }

  .font-serif-title {
    font-family: 'Noto Serif SC', "Songti SC", STSong, serif;
  }

  .card-luxury {
    background: var(--card-bg);
    border-radius: 16px;
    border: 1px solid #F0ECE6;
    box-shadow: 0 4px 20px -2px rgba(28, 25, 23, 0.03), 0 2px 6px -1px rgba(28, 25, 23, 0.02);
  }

  .tap {
    min-height: 44px;
    touch-action: manipulation;
    -webkit-user-select: none;
    user-select: none;
  }

  .input-luxury {
    width: 100%;
    border: 1px solid #E7E5E4;
    border-radius: 12px;
    padding: 11px 14px;
    font-size: 13px;
    background: #FAFAFA;
    color: #1C1917;
    transition: all .2s ease;
  }
  .input-luxury:focus {
    border-color: #C5A059;
    background: #FFFFFF;
    outline: none;
    box-shadow: 0 0 0 3px rgba(197, 160, 89, 0.15);
  }

  /* Filter Pills */
  .pill {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 8px 16px; border-radius: 999px;
    font-size: 12px; font-weight: 600;
    border: 1px solid #E7E5E4; background: #FFFFFF; color: #57534E;
    transition: all .2s ease;
  }
  .pill.active {
    background: #262322; border-color: #262322; color: #F5F5F4;
    box-shadow: 0 2px 8px rgba(38,35,34,0.15);
  }

  /* Status Badges */
  .badge-luxury {
    padding: 4px 10px; border-radius: 999px;
    font-size: 11px; font-weight: 700; letter-spacing: 0.02em;
  }
  .st-pending { background: #F5F5F4; color: #78716C; }
  .st-pass { background: #ECFDF5; color: #047857; border: 1px solid #A7F3D0; }
  .st-progress { background: #FFFBEB; color: #B45309; border: 1px solid #FDE68A; }
  .st-risk { background: #FEF2F2; color: #B91C1C; border: 1px solid #FECACA; }

  /* Segmented Bar */
  .seg-bar {
    display: flex; overflow-x: auto; gap: 8px; padding: 10px 14px;
    -webkit-overflow-scrolling: touch; scrollbar-width: none;
    background: rgba(250, 248, 245, 0.95);
    backdrop-filter: blur(10px);
  }
  .seg-bar::-webkit-scrollbar { display: none; }
  .seg-btn {
    flex: 0 0 auto; padding: 9px 16px; border-radius: 12px;
    font-size: 12px; font-weight: 600; color: #78716C; background: #FFFFFF;
    border: 1px solid #E7E5E4; white-space: nowrap; transition: all .2s ease;
  }
  .seg-btn.active {
    background: #1C1917; color: #F5F5F4; border-color: #1C1917;
    box-shadow: 0 4px 12px rgba(28, 25, 23, 0.12);
  }

  .acc-body { overflow: hidden; transition: max-height .3s cubic-bezier(0.4, 0, 0.2, 1); }
  .field-label { font-size: 11px; color: #A8A29E; font-weight: 700; margin-bottom: 5px; text-transform: uppercase; letter-spacing: 0.05em; }
</style>
</head>
<body>

<!-- ===== Header (Luxury Warm Dark) ===== -->
<header class="sticky top-0 z-40 bg-[#1C1917] text-[#F5F5F4] shadow-md border-b border-[#2A2725]">
  <div class="px-4 pt-3.5 pb-2.5">
    <div class="flex items-center justify-between">
      <div class="flex items-center gap-2.5">
        <div class="w-8 h-8 rounded-lg bg-[#C5A059]/20 border border-[#C5A059]/40 flex items-center justify-center text-[#C5A059] font-bold text-sm">金</div>
        <div>
          <div class="text-[15px] font-serif-title font-bold text-[#F5F5F4] tracking-wide">金山岭小院 · 施工协同</div>
          <div class="text-[10px] text-[#A8A29E] mt-0.5 tracking-wider">9月3日现场交底 · 雅奢庭院与装置</div>
        </div>
      </div>
      <select id="userRole" class="bg-[#2A2725] text-[#D6D3D1] text-xs font-semibold rounded-lg px-2.5 py-2 border border-[#44403C] focus:outline-none focus:border-[#C5A059] max-w-[135px]">
        <option value="业主代表">业主代表</option>
        <option value="建筑设计(MINOR lab)">建筑设计</option>
        <option value="石材厂(里山墨石)">石材厂·汤</option>
        <option value="施工方(总包/钢构)">施工方</option>
        <option value="园林设计">园林设计</option>
      </select>
    </div>
  </div>

  <!-- Segmented Navigation -->
  <div class="seg-bar border-t border-[#2A2725]">
    <button onclick="switchTab('tab1')" id="t1" class="seg-btn active">📋 交底清单</button>
    <button onclick="switchTab('tab2')" id="t2" class="seg-btn">📜 修改日志 <span id="logCnt" class="ml-1 text-[#C5A059] font-bold">0</span></button>
    <button onclick="switchTab('tab3')" id="t3" class="seg-btn">🧱 工程量清单</button>
    <button onclick="switchTab('tab4')" id="t4" class="seg-btn">🔀 交叉碰撞</button>
    <button onclick="switchTab('tab5')" id="t5" class="seg-btn">🏗️ 吊车计算</button>
    <button onclick="switchTab('tab6')" id="t6" class="seg-btn">⏳ 里程碑</button>
  </div>
</header>

<main class="px-3.5 pt-4 space-y-4">

  <!-- ============ TAB 1 : CHECKLIST ============ -->
  <section id="tab1" class="space-y-3.5">
    <!-- Progress & KPI Card -->
    <div class="card-luxury p-4">
      <div class="flex items-center justify-between mb-2">
        <div class="text-xs font-serif-title font-bold text-[#1C1917] tracking-wider">交底核对总进度</div>
        <div class="text-sm font-extrabold text-[#C5A059]" id="overallPct">0%</div>
      </div>
      <div class="h-1.5 bg-[#F5F5F4] rounded-full overflow-hidden">
        <div id="overallBar" class="h-full bg-[#C5A059] rounded-full transition-all duration-500" style="width:0%"></div>
      </div>
      <div class="grid grid-cols-4 gap-2 mt-4 text-center border-t border-[#F5F5F4] pt-3">
        <div><div class="text-base font-bold text-[#1C1917]" id="kpiTotal">17</div><div class="text-[10px] text-[#A8A29E] mt-0.5">总项</div></div>
        <div><div class="text-base font-bold text-[#047857]" id="kpiPass">0</div><div class="text-[10px] text-[#A8A29E] mt-0.5">已通过</div></div>
        <div><div class="text-base font-bold text-[#B45309]" id="kpiProgress">0</div><div class="text-[10px] text-[#A8A29E] mt-0.5">处理中</div></div>
        <div><div class="text-base font-bold text-[#A8A29E]" id="kpiPending">17</div><div class="text-[10px] text-[#A8A29E] mt-0.5">未复核</div></div>
      </div>
    </div>

    <!-- Filter Pills -->
    <div class="flex gap-2 overflow-x-auto no-scrollbar py-1" id="filterChips">
      <button class="pill active" data-f="all" onclick="setFilter('all', this)">全部项</button>
      <button class="pill" data-f="pass" onclick="setFilter('pass', this)">🟢 已通过</button>
      <button class="pill" data-f="progress" onclick="setFilter('progress', this)">🟡 处理中</button>
      <button class="pill" data-f="risk" onclick="setFilter('risk', this)">🔴 存疑整改</button>
      <button class="pill" data-f="pending" onclick="setFilter('pending', this)">⚪ 未复核</button>
    </div>

    <!-- Checklist Cards -->
    <div id="checklistContainer" class="space-y-3"></div>
  </section>

  <!-- ============ TAB 2 : AUDIT LOG ============ -->
  <section id="tab2" class="hidden space-y-3">
    <div class="card-luxury p-3.5 flex items-center justify-between">

    </div>
    <div id="auditContainer" class="space-y-2.5"></div>
  </section>

  <!-- ============ TAB 3 : MANIFEST ============ -->
  <section id="tab3" class="hidden space-y-3.5">
    <div class="card-luxury p-4 bg-gradient-to-br from-[#1C1917] to-[#2A2725] text-[#F5F5F4]">

      <div class="text-3xl font-serif-title font-bold text-[#FFFFFF] mt-1">34.38 <span class="text-base font-sans font-normal text-[#D6D3D1]">吨</span></div>
      <div class="grid grid-cols-3 gap-2 mt-4 pt-3 border-t border-[#383533] text-center">
        <div class="bg-[#2A2725] rounded-xl p-2 border border-[#383533]"><div class="text-sm font-bold text-[#C5A059]">24.34t</div><div class="text-[10px] text-[#A8A29E] mt-0.5">石材 (里山墨石)</div></div>
        <div class="bg-[#2A2725] rounded-xl p-2 border border-[#383533]"><div class="text-sm font-bold text-[#E7E5E4]">1.70t</div><div class="text-[10px] text-[#A8A29E] mt-0.5">钢结构平台</div></div>
        <div class="bg-[#2A2725] rounded-xl p-2 border border-[#383533]"><div class="text-sm font-bold text-[#E7E5E4]">8.50t</div><div class="text-[10px] text-[#A8A29E] mt-0.5">C25混凝土基础</div></div>
      </div>
    </div>
    <div id="manifestContainer" class="space-y-3"></div>
  </section>

  <!-- ============ TAB 4 : CROSS POINTS ============ -->
  <section id="tab4" class="hidden space-y-3.5">
    <div class="card-luxury p-4">
      <div class="text-xs font-serif-title font-bold text-[#1C1917]">6 大主工序 · 5 处关键交叉碰撞控制</div>
      <div class="text-[11px] text-[#78716C] mt-1">防止基础受损、螺栓眼错位及电焊火花烧伤艺术石材</div>
    </div>
    <div id="crossContainer" class="space-y-3"></div>
  </section>

  <!-- ============ TAB 5 : CRANE ============ -->
  <section id="tab5" class="hidden space-y-3.5">
    <div id="craneContainer" class="space-y-3.5"></div>
  </section>

  <!-- ============ TAB 6 : WBS ============ -->
  <section id="tab6" class="hidden space-y-3.5">
    <div class="card-luxury p-4">
      <div class="text-xs font-serif-title font-bold text-[#1C1917]">施工进度排期与关键里程碑</div>
      <div class="text-[11px] text-[#78716C] mt-1">10 大 WBS 节点 · 现场验收与交接卡口</div>
    </div>
    <div id="wbsContainer" class="space-y-2.5"></div>
  </section>

</main>

<!-- ===== Elegant Bottom Bar ===== -->
<footer class="fixed bottom-0 left-0 right-0 z-40 bg-[#FFFFFF]/95 backdrop-blur-md border-t border-[#E7E5E4] px-4 py-2.5">
  <div class="flex gap-2.5 max-w-md mx-auto">
    <button onclick="saveData()" class="flex-1 tap bg-[#1C1917] active:bg-[#2A2725] text-[#F5F5F4] rounded-xl py-3 text-xs font-bold tracking-wider shadow-sm transition">💾 保存改动</button>
    <button onclick="exportJSON()" class="flex-1 tap bg-[#F5F5F4] active:bg-[#E7E5E4] text-[#44403C] rounded-xl py-3 text-xs font-bold border border-[#E7E5E4] transition">📤 导出</button>
    <button onclick="document.getElementById('importFile').click()" class="flex-1 tap bg-[#F5F5F4] active:bg-[#E7E5E4] text-[#44403C] rounded-xl py-3 text-xs font-bold border border-[#E7E5E4] transition">📥 导入</button>
    <input type="file" id="importFile" onchange="importJSON(event)" class="hidden">
  </div>
</footer>

let auditLogs = [];
let currentFilter = 'all';
let expandedSet = new Set();

function loadSavedData() {
  try {
    const c = localStorage.getItem('jl_checklist_v3');
    const l = localStorage.getItem('jl_logs_v3');
    if (c) checklistData = JSON.parse(c);
    if (l) auditLogs = JSON.parse(l);
  } catch(e){}
}

function escapeHtml(s){ if(!s) return ''; return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function stClass(st){
  if(st==='已通过(无误差)') return 'st-pass';
  if(st==='存疑/需整改') return 'st-risk';
  if(st==='处理中') return 'st-progress';
  return 'st-pending';
}
function stLabel(st){
  if(st==='已通过(无误差)') return '🟢 已通过';
  if(st==='存疑/需整改') return '🔴 存疑整改';
  if(st==='处理中') return '🟡 处理中';
  return '⚪ 未复核';
}

function matchesFilter(st){
  if(currentFilter==='all') return true;
  if(currentFilter==='pass') return st==='已通过(无误差)';
  if(currentFilter==='risk') return st==='存疑/需整改';
  if(currentFilter==='progress') return st==='处理中';
  if(currentFilter==='pending') return st==='未复核';
  return true;
}

function renderChecklist(){
  const cont = document.getElementById('checklistContainer');
  cont.innerHTML = '';
  let total=0, pass=0, progress=0, pending=0;

  checklistData.forEach((sec, si) => {
    let sTotal = sec.items.length, sPass = sec.items.filter(i=>i.status==='已通过(无误差)').length;
    const visibleItems = sec.items.filter(i => matchesFilter(i.status));
    if (visibleItems.length === 0) return;

    // Section header
    const secCard = document.createElement('div');
    secCard.className = 'card-luxury p-3.5';
    secCard.innerHTML = `
      <div class="flex items-center justify-between">
        <div class="text-[13px] font-serif-title font-bold text-[#1C1917]">${sec.section}</div>
        <div class="text-[11px] font-semibold ${sPass===sTotal ? 'text-[#047857]' : 'text-[#A8A29E]'}">${sPass}/${sTotal}</div>
      </div>
      <div class="h-1 bg-[#F5F5F4] rounded-full mt-2 overflow-hidden">
        <div class="h-full bg-[#C5A059] rounded-full" style="width:${sPass/sTotal*100}%"></div>
      </div>`;
    cont.appendChild(secCard);

    visibleItems.forEach((item, ii) => {
      total++; 
      if(item.status==='已通过(无误差)') pass++;
      else if(item.status==='存疑/需整改'||item.status==='处理中') progress++;
      else pending++;

      const gi = sec.items.indexOf(item);
      const key = si+'-'+gi;
      const isOpen = expandedSet.has(key);

      const card = document.createElement('div');
      card.className = 'card-luxury overflow-hidden';
      card.innerHTML = `
        <div class="tap p-3.5 flex items-start gap-3" onclick="toggleCard('${key}')">
          <div class="flex-shrink-0 w-8 h-8 rounded-lg bg-[#FAF6F0] text-[#C5A059] flex items-center justify-center text-xs font-bold font-serif-title border border-[#EFE8DE]">${item.id}</div>
          <div class="flex-1 min-w-0">
            <div class="flex items-center justify-between gap-2">
              <div class="text-[13px] font-bold text-[#1C1917] leading-tight">${escapeHtml(item.name)}</div>
              <span class="badge-luxury ${stClass(item.status)} flex-shrink-0">${stLabel(item.status)}</span>
            </div>
            <div class="text-[11px] text-[#78716C] mt-1 line-clamp-2 leading-relaxed">${escapeHtml(item.desc)}</div>
          </div>
          <svg class="flex-shrink-0 w-4 h-4 text-[#A8A29E] transition-transform duration-300 ${isOpen?'rotate-180':''}" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/></svg>
        </div>
        <div class="acc-body" style="max-height:${isOpen?'1000px':'0px'}">
          <div class="px-3.5 pb-3.5 space-y-3 border-t border-[#F5F5F4] pt-3">
            <div class="flex items-center justify-between text-[11px] text-[#A8A29E]">
              <span class="font-mono">📐 ${escapeHtml(item.ref)}</span>
              <span>👥 ${escapeHtml(item.owner)}</span>
            </div>

            <div>
              <div class="field-label">评估状态</div>
              <div class="grid grid-cols-4 gap-1.5">
                ${['未复核','已通过(无误差)','处理中','存疑/需整改'].map(st=>`
                  <button onclick="setStatus(${si},${gi},'${st}')" class="tap py-2 rounded-xl text-[11px] font-bold border transition ${item.status===st?stClass(st):'bg-[#FAF9F5] text-[#78716C] border-[#E7E5E4]'}">${stLabel(st).replace('⚪ ','').replace('🟢 ','').replace('🟡 ','').replace('🔴 ','')}</button>
                `).join('')}
              </div>
            </div>

            <div>
              <div class="field-label">现场实测数据 / 决定记录</div>
              <textarea class="input-luxury" rows="2" onchange="onField(${si},${gi},'measure','实测决定',this.value,'${escapeHtml(item.measure)}')">${escapeHtml(item.measure)}</textarea>
            </div>

            <div>
              <div class="field-label">整改 / 落实行动计划</div>
              <textarea class="input-luxury" rows="2" onchange="onField(${si},${gi},'action','行动计划',this.value,'${escapeHtml(item.action)}')">${escapeHtml(item.action)}</textarea>
            </div>

            <div class="grid grid-cols-2 gap-2">
              <div>
                <div class="field-label">完成日期</div>
                <input type="date" class="input-luxury text-center" value="${item.date}" onchange="onField(${si},${gi},'date','完成日期',this.value,'${item.date}')">
              </div>
              <div>
                <div class="field-label">复核签字</div>
                <input type="text" class="input-luxury text-center font-semibold" placeholder="签字" value="${escapeHtml(item.reviewer||'')}" onchange="onField(${si},${gi},'reviewer','复核签字',this.value,'${escapeHtml(item.reviewer||'')}')">
              </div>
            </div>
          </div>
        </div>`;
      cont.appendChild(card);
    });
  });

  document.getElementById('kpiTotal').innerText = total;
  document.getElementById('kpiPass').innerText = pass;
  document.getElementById('kpiProgress').innerText = progress;
  document.getElementById('kpiPending').innerText = pending;
  const pct = total ? Math.round(pass/total*100) : 0;
  document.getElementById('overallPct').innerText = pct + '%';
  document.getElementById('overallBar').style.width = pct + '%';
}

function toggleCard(key){
  if(expandedSet.has(key)) expandedSet.delete(key); else expandedSet.add(key);
  renderChecklist();
}

function setFilter(f, el){
  currentFilter = f;
  document.querySelectorAll('#filterChips .pill').forEach(c=>c.classList.remove('active'));
  el.classList.add('active');
  renderChecklist();
}

function setStatus(si, gi, st){
  onField(si, gi, 'status', '评估状态', st, checklistData[si].items[gi].status);
}

function onField(si, gi, key, fieldName, newVal, oldVal){
  if(newVal === oldVal) return;
  const item = checklistData[si].items[gi];
  const operator = document.getElementById('userRole').value || '未知操作人';
  const ts = new Date().toLocaleString('zh-CN',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'});
  auditLogs.unshift({ time: ts, user: operator, id: item.id, field: fieldName, oldVal: oldVal||'(空)', newVal: newVal||'(空)' });
  item[key] = newVal;
  saveLocal();
  renderChecklist();
  renderAudit();
}

  document.getElementById('logCnt').innerText = auditLogs.length;

    cont.innerHTML = '<div class="card-luxury p-8 text-center text-[#A8A29E] text-xs font-serif-title">暂无修改历史记录</div>';

function renderWbs(){
  const cont = document.getElementById('wbsContainer');
  if(!cont) return;
  cont.innerHTML = '';
  wbsData.forEach((w,i)=>{
    const div = document.createElement('div');
    div.className = 'card-luxury p-3.5 flex items-center gap-3';
    div.innerHTML = `
      <div class="flex flex-col items-center">
        <div class="w-7 h-7 rounded-lg bg-[#1C1917] text-[#C5A059] font-serif-title flex items-center justify-center text-[11px] font-bold">${i+1}</div>
        ${i<wbsData.length-1?'<div class="w-px flex-1 bg-[#E7E5E4] my-1"></div>':''}
      </div>
      <div class="flex-1 min-w-0">
        <div class="flex items-center justify-between">
          <span class="text-[11px] font-mono font-bold text-[#C5A059]">${w.code}</span>
          <span class="text-[10px] bg-[#F5F5F4] text-[#78716C] px-2 py-0.5 rounded font-semibold">${w.days}天</span>
        </div>
        <div class="text-[13px] font-bold text-[#1C1917] mt-0.5">${w.name}</div>
        <div class="text-[11px] text-[#A8A29E] mt-0.5">${w.owner} · ${w.start} → ${w.end}</div>
        <div class="text-[10px] mt-1.5 inline-flex bg-[#FAF6F0] text-[#B45309] border border-[#EFE8DE] px-2 py-0.5 rounded-md font-medium">📍 ${w.ms}</div>
      </div>`;
    cont.appendChild(div);
  });
}

function saveLocal(){
  localStorage.setItem('jl_checklist_v3', JSON.stringify(checklistData));
  localStorage.setItem('jl_logs_v3', JSON.stringify(auditLogs));
}
function saveData(){
  saveLocal();
  alert('💾 包含完整修改痕迹的数据已成功保存！');
}
function exportJSON(){
  const obj = { checklistData, auditLogs };
  const s = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(obj,null,2));
  const a = document.createElement('a');
  a.href = s; a.download = `金山岭小院交底数据_${new Date().toISOString().slice(0,10)}.json`;
  document.body.appendChild(a); a.click(); a.remove();
}
function importJSON(e){
  const f = e.target.files[0]; if(!f) return;
  const r = new FileReader();
  r.onload = function(ev){
    try{
      const d = JSON.parse(ev.target.result);
      if(d.checklistData && Array.isArray(d.checklistData)){ checklistData = d.checklistData; auditLogs = d.auditLogs||[]; }
      else if(Array.isArray(d)){ checklistData = d; }
      saveLocal(); renderChecklist(); renderAudit();
      alert('📥 成功导入数据及修改痕迹！');
    }catch(err){ alert('⚠️ 导入文件格式错误！'); }
  };
  r.readAsText(f);
}

function switchTab(tab){
  for(let i=1;i<=6;i++){
    document.getElementById('tab'+i).classList.add('hidden');
    document.getElementById('t'+i).classList.remove('active');
  }
  document.getElementById(tab).classList.remove('hidden');
  document.getElementById(tab.replace('tab','t')).classList.add('active');
  window.scrollTo({top:0, behavior:'smooth'});
}

// Init
loadSavedData();
renderChecklist();
renderAudit();
renderManifest();
renderCross();
renderCrane();
renderWbs();
</script>
